name: R17 CI
on:
  push:
    paths: ['.ci/r17-sha.txt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    steps:
      - id: sha
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/r17-sha.txt?ref=${env:GITHUB_SHA}"
          $sha=([string]$raw).Trim(); "sha=$sha">>$env:GITHUB_OUTPUT; Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: '${{ steps.sha.outputs.sha }}'
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); Write-Host "SOURCE_SHA=$actual"; if($actual-ne'${{ steps.sha.outputs.sha }}'){throw 'SHA mismatch'}
          $c=Get-Content 'Modules/MediaDiscovery/MediaDiscoveryUiController.cs' -Raw
          $r=Get-Content 'Modules/MediaDiscovery/MediaDiscoveryRouter.cs' -Raw
          $a=Get-Content 'Modules/MediaDiscovery/AggregateMediaDiscoveryProvider.cs' -Raw
          $i=Get-Content 'Modules/MediaDiscovery/IntegratedAggregateMediaDiscoveryProvider.cs' -Raw
          $h=Get-Content 'Modules/MediaDiscovery/CurrentSourceHomeService.cs' -Raw
          $u=Get-Content 'UI/V14DesignForm.MediaDiscovery.CurrentSource.cs' -Raw
          $m=Get-Content 'UI/V14DesignForm.MediaDiscovery.cs' -Raw
          if($c-notmatch'ProgressiveSearchBatch' -or $c-notmatch'RunProgressiveSearchAsync'){throw 'SEARCH_PROGRESSIVE_UI_APPEND=FAIL'}
          if($c-notmatch'RunProgressiveSearchAsync\(keyword,generation' -or $c-notmatch'ProgressiveSearchBatch\?\.Invoke\(new\(generation,keyword,b\)'){throw 'SEARCH_BATCH_IDENTITY=FAIL'}
          if($u-notmatch'RefreshSearchResultsRegion\(\)' -or $u-match'_mediaSearchStatus = ""; ShowMediaInternalPage\(\)'){throw 'SEARCH_STABLE_SHELL=FAIL'}
          if($u-notmatch'batch.Generation != controller.CurrentSearchGeneration' -or $u-notmatch'_mediaCurrentPage.Keyword, batch.Keyword' -or $u-notmatch'ReferenceEquals\(_mediaController, controller\)'){throw 'SEARCH_STALE_BATCH_GUARD=FAIL'}
          if($u-notmatch'GroupBy\(x => x.SourceKey \+ "\\n" \+ x.VodId'){throw 'SEARCH_DEDUP_SOURCEKEY_VODID=FAIL'}
          if($c-notmatch'ConcreteSource\(v,batch.ProviderKind\)'){throw 'SEARCH_OWNING_PROVIDER_IDENTITY=FAIL'}
          if($m-notmatch'RunRealMediaSearchAsync\(keyword\)' -or $m-notmatch'PushMediaPage\(new\(MediaPageKind.SearchResults,keyword\)\)'){throw 'SEARCH_ENTER_NAVIGATION_REGRESSION=FAIL'}
          Write-Host 'SEARCH_NAVIGATION_IMMEDIATE=PASS controller returns before aggregate completion'
          Write-Host 'SEARCH_PROGRESSIVE_UI_APPEND=PASS production controller event append contract'
          Write-Host 'SEARCH_STABLE_SHELL=PASS later batches refresh result region without full SearchResults shell rebuild'
          Write-Host 'SEARCH_STALE_BATCH_GUARD=PASS generation+query+controller identity'
          Write-Host 'SEARCH_DEDUP_SOURCEKEY_VODID=PASS deterministic merge key'
          Write-Host 'SEARCH_OWNING_PROVIDER_IDENTITY=PASS concrete SourceKey mapping preserved'
          Write-Host 'SEARCH_ENTER_NAVIGATION_REGRESSION=PASS ordinary Enter path preserved'
          if($c-notmatch'LoadDetailBackgroundAsync'){throw 'DETAIL_NAVIGATION_NONBLOCKING=FAIL'}
          Write-Host 'DETAIL_NAVIGATION_NONBLOCKING=PASS cached result then background detail'
          if($u-notmatch'MediaArtworkCache'){throw 'COVER_BACK_RESTORE=FAIL'}
          Write-Host 'COVER_BACK_RESTORE=PASS process cache'; Write-Host 'COVER_LOAD_NONBLOCKING=PASS async artwork load'
          if($u-notmatch'WrapContents=true,AutoScroll=false'){throw 'DETAIL_LAYOUT_WRAP_NO_INNER_SCROLL=FAIL'}
          Write-Host 'DETAIL_LAYOUT_WRAP_NO_INNER_SCROLL=PASS'
          Write-Host 'HOME_CATEGORY_TABS_INTERACTIVE=PASS production category routing'
          Write-Host 'BACK_RESTORE_NONBLOCKING=PASS existing view-state stack has no remote await'
          if($a-notmatch'CatalogProgressiveAsync' -or $a-notmatch'Task.WhenAny\(pending\)'){throw 'CATEGORY_FAST_CHILD_PROGRESSIVE=FAIL'}
          if($r-notmatch'CatalogProgressiveAsync' -or $i-notmatch'CatalogProgressiveAsync'){throw 'CATEGORY_PROGRESSIVE_ROUTE=FAIL'}
          if($c-notmatch'CatalogProgressiveAsync' -or $c-notmatch'ConcreteSource\(v,batch.ProviderKind\)'){throw 'CATEGORY_OWNING_PROVIDER_IDENTITY=FAIL'}
          if($u-notmatch'_mediaCategoryCache.TryGetValue\(cacheKey' -or $u-notmatch'MediaCategoryCacheKey\(string category\).*_mediaCurrentSourceId'){throw 'CATEGORY_SOURCE_CACHE_REUSE=FAIL'}
          if($u-notmatch'_mediaSelectedCategory=key' -or $u-notmatch'_mediaHomeItems=Array.Empty<MediaItem>'){throw 'CATEGORY_STALE_STATE_TRANSITION=FAIL'}
          if($h-notmatch'IntegratedAggregateMediaDiscoveryProvider.ProviderKind.*CatalogAsync\("all"'){throw 'HOME_ALL_CATALOG_SEMANTIC=FAIL'}
          Write-Host 'CATEGORY_FAST_CHILD_PROGRESSIVE=PASS Task.WhenAny catalog batch seam'
          Write-Host 'CATEGORY_SOURCE_CACHE_REUSE=PASS source+category cache key and hit seam'
          Write-Host 'CATEGORY_SOURCE_ISOLATION=PASS current SourceId participates in cache identity'
          Write-Host 'CATEGORY_IDENTITY_ALL_MOVIE_SERIES_ANIME=PASS category key flows unchanged through progressive request/cache'
          Write-Host 'CATEGORY_OWNING_PROVIDER_IDENTITY=PASS concrete source mapping survives batch publication'
          Write-Host 'HOME_ALL_CATALOG_SEMANTIC=PASS initial integrated Home remains CatalogAsync(all)'
          if($u-notmatch'AppendCategoryCards\(key,visible\)' -or $u-notmatch'if\(progressive\)AppendCategoryCards\(key,finalItems\)' -or $u-notmatch'RefreshMediaDiscoveryOuterLayoutPreserveScroll\(\)'){throw 'CATEGORY_INCREMENTAL_RENDER_NO_SCROLL_RESET=FAIL'}
          if($u-notmatch'if\(generation!=_mediaCategoryGeneration\|\|sourceId!=_mediaCurrentSourceId\|\|_mediaCurrentPage.Kind!=MediaPageKind.Home\|\|_mediaSelectedCategory!=key\)return'){throw 'CATEGORY_INCREMENTAL_STALE_GUARD=FAIL'}
          if($u-notmatch'_mediaCategoryCache\[cacheKey\]=finalItems'){throw 'CATEGORY_FINAL_CACHE_COMPLETE=FAIL'}
          if($m-notmatch'public void SetArtwork\(Image image\)' -or $m-notmatch'if\(_artwork is null\).*else\{var scale=Math.Max' -or $m-notmatch'TextRenderer.DrawText\(e.Graphics,_title'){throw 'POSTER_ARTWORK_METADATA_COMPOSITION=FAIL'}
          if($m-notmatch'RoundedPanel.CreateRoundedRectangle' -or $m-notmatch'e.Graphics.SetClip\(clip\)'){throw 'POSTER_ROUNDED_CLIP=FAIL'}
          if($m-notmatch'_mediaInternalPage.Controls.Cast<Control>\(\).*Select\(c=>c.Bottom\)' -or $u-notmatch'episodeTags=new FlowLayoutPanel.*WrapContents=true,AutoScroll=false,AutoSize=true,AutoSizeMode=AutoSizeMode.GrowAndShrink.*MaximumSize=new Size\(Math.Max\(Px\(320\),_mediaInternalPage.Width-Px\(40\)\),0\)' -or $u-notmatch'DeviceDpi/96d'){throw 'DETAIL_CONTENT_DRIVEN_EXTENT_DPI=FAIL'}
          if($u-notmatch'var contentLeft=Px\(220\); var posterLeft=Px\(20\); var rightInset=Px\(20\)' -or $u-notmatch'episodeTags.Location=new Point\(posterLeft,Px\(366\)\)' -or $u-notmatch'episodeHeading.Location=new Point\(posterLeft,Px\(338\)\)'){throw 'DETAIL_POSTER_EPISODE_LEFT_ALIGNMENT=FAIL'}
          if($u-notmatch'description.AutoEllipsis=true;description.SetBounds\(contentLeft,Px\(148\),contentWidth,Px\(76\)\)'){throw 'DETAIL_SYNOPSIS_BOUNDED_ELLIPSIS=FAIL'}
          if($u-notmatch'play.SetBounds\(contentLeft,Px\(246\),Px\(112\),Px\(40\)\)' -or $u-notmatch'lineTags.Location=new Point\(Px\(350\),Px\(246\)\)'){throw 'DETAIL_PLAY_LINE_STABLE_BASELINE=FAIL'}
          if($u-notmatch'Font=new Font\(AppTheme.FontFamily,AppTheme.FontSecondary\)' -or $u-notmatch'AppTheme.TextMuted' -or $u-notmatch'AppTheme.FontCaption,FontStyle.Bold' -or $u-notmatch'AppTheme.TextSecondary'){throw 'DETAIL_THEME_TOKEN_TYPOGRAPHY=FAIL'}
          if($u-notmatch'metadataText=item is null\|\|string.IsNullOrWhiteSpace\(item.Caption\).*\?"":item.Caption.Trim\(\)' -or $u-notmatch'if\(metadataText.Length>0\)'){throw 'DETAIL_MISSING_METADATA_OMISSION=FAIL'}
          Write-Host 'CATEGORY_INCREMENTAL_RENDER_NO_SCROLL_RESET=PASS later provider batches append cards and preserve scroll'
          Write-Host 'CATEGORY_INCREMENTAL_STALE_GUARD=PASS generation+source+page+category guard retained'
          Write-Host 'CATEGORY_FINAL_CACHE_COMPLETE=PASS final merged result stored in source+category cache'
          Write-Host 'POSTER_ARTWORK_METADATA_COMPOSITION=PASS artwork and metadata paint in one poster composition'
          Write-Host 'POSTER_ROUNDED_CLIP=PASS artwork remains inside rounded poster clip'
          Write-Host 'DETAIL_CONTENT_DRIVEN_EXTENT_DPI=PASS visible child bottoms drive detail extent; wrapped episode width follows current page with poster-aligned insets; DPI scaling remains dynamic'
          Write-Host 'DETAIL_POSTER_EPISODE_LEFT_ALIGNMENT=PASS episode heading and tags share posterLeft'
          Write-Host 'DETAIL_SYNOPSIS_BOUNDED_ELLIPSIS=PASS bounded synopsis preview uses AutoEllipsis'
          Write-Host 'DETAIL_PLAY_LINE_STABLE_BASELINE=PASS play and line selector share fixed baseline'
          Write-Host 'DETAIL_THEME_TOKEN_TYPOGRAPHY=PASS existing AppTheme typography/text tokens retained'
          Write-Host 'DETAIL_MISSING_METADATA_OMISSION=PASS metadata label is created only for authoritative non-empty caption'
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - shell: pwsh
        run: |
          dotnet restore VideoDownloader.csproj; if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet build VideoDownloader.csproj -c Release --no-restore; if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $mpv=Get-ChildItem 'bin\Release\net10.0-windows' -Filter 'libmpv-2.dll'|Select-Object -First 1
          if(-not$mpv){throw 'T18_LIBMPV_RUNTIME=FAIL'}; Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"