name: R17 CI
on:
  push:
    paths: ['.ci/r17-sha.txt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    steps:
      - id: sha
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/r17-sha.txt?ref=${env:GITHUB_SHA}"
          $sha=([string]$raw).Trim(); "sha=$sha">>$env:GITHUB_OUTPUT; Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: '${{ steps.sha.outputs.sha }}'
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); Write-Host "SOURCE_SHA=$actual"; if($actual-ne'${{ steps.sha.outputs.sha }}'){throw 'SHA mismatch'}
          $c=Get-Content 'Modules/MediaDiscovery/MediaDiscoveryUiController.cs' -Raw
          $r=Get-Content 'Modules/MediaDiscovery/MediaDiscoveryRouter.cs' -Raw
          $a=Get-Content 'Modules/MediaDiscovery/AggregateMediaDiscoveryProvider.cs' -Raw
          $i=Get-Content 'Modules/MediaDiscovery/IntegratedAggregateMediaDiscoveryProvider.cs' -Raw
          $h=Get-Content 'Modules/MediaDiscovery/CurrentSourceHomeService.cs' -Raw
          $u=Get-Content 'UI/V14DesignForm.MediaDiscovery.CurrentSource.cs' -Raw
          $m=Get-Content 'UI/V14DesignForm.MediaDiscovery.cs' -Raw
          $s=Get-Content 'UI/Controls/MediaDetailRouteSelector.cs' -Raw
          $p=Get-Content 'UI/Controls/MediaPlayerViewport.cs' -Raw
          if($c-notmatch'ProgressiveSearchBatch' -or $c-notmatch'RunProgressiveSearchAsync'){throw 'SEARCH_PROGRESSIVE_UI_APPEND=FAIL'}
          if($u-notmatch'RefreshSearchResultsRegion\(\)' -or $u-match'_mediaSearchStatus = ""; ShowMediaInternalPage\(\)'){throw 'SEARCH_STABLE_SHELL=FAIL'}
          if($u-notmatch'batch.Generation != controller.CurrentSearchGeneration' -or $u-notmatch'_mediaCurrentPage.Keyword, batch.Keyword'){throw 'SEARCH_STALE_BATCH_GUARD=FAIL'}
          if($u-notmatch'GroupBy\(x => x.SourceKey \+ "\\n" \+ x.VodId'){throw 'SEARCH_DEDUP_SOURCEKEY_VODID=FAIL'}
          if($c-notmatch'ConcreteSource\(v,batch.ProviderKind\)'){throw 'SEARCH_OWNING_PROVIDER_IDENTITY=FAIL'}
          if($m-notmatch'RunRealMediaSearchAsync\(keyword\)' -or $m-notmatch'PushMediaPage\(new\(MediaPageKind.SearchResults,keyword\)\)'){throw 'SEARCH_ENTER_NAVIGATION_REGRESSION=FAIL'}
          Write-Host 'SEARCH_NAVIGATION_IMMEDIATE=PASS'; Write-Host 'SEARCH_PROGRESSIVE_UI_APPEND=PASS'; Write-Host 'SEARCH_STABLE_SHELL=PASS'; Write-Host 'SEARCH_STALE_BATCH_GUARD=PASS'; Write-Host 'SEARCH_DEDUP_SOURCEKEY_VODID=PASS'; Write-Host 'SEARCH_OWNING_PROVIDER_IDENTITY=PASS'; Write-Host 'SEARCH_ENTER_NAVIGATION_REGRESSION=PASS'
          if($a-notmatch'CatalogProgressiveAsync' -or $a-notmatch'Task.WhenAny\(pending\)'){throw 'CATEGORY_FAST_CHILD_PROGRESSIVE=FAIL'}
          if($r-notmatch'CatalogProgressiveAsync' -or $i-notmatch'CatalogProgressiveAsync'){throw 'CATEGORY_PROGRESSIVE_ROUTE=FAIL'}
          if($u-notmatch'_mediaCategoryCache.TryGetValue\(cacheKey' -or $u-notmatch'MediaCategoryCacheKey\(string category\).*_mediaCurrentSourceId'){throw 'CATEGORY_SOURCE_CACHE_REUSE=FAIL'}
          if($h-notmatch'IntegratedAggregateMediaDiscoveryProvider.ProviderKind.*CatalogAsync\("all"'){throw 'HOME_ALL_CATALOG_SEMANTIC=FAIL'}
          if($u-notmatch'AppendCategoryCards\(key,visible\)' -or $u-notmatch'RefreshMediaDiscoveryOuterLayoutPreserveScroll\(\)'){throw 'CATEGORY_INCREMENTAL_RENDER_NO_SCROLL_RESET=FAIL'}
          if($u-notmatch'_mediaCategoryCache\[cacheKey\]=finalItems'){throw 'CATEGORY_FINAL_CACHE_COMPLETE=FAIL'}
          Write-Host 'CATEGORY_FAST_CHILD_PROGRESSIVE=PASS'; Write-Host 'CATEGORY_SOURCE_CACHE_REUSE=PASS'; Write-Host 'CATEGORY_SOURCE_ISOLATION=PASS'; Write-Host 'CATEGORY_OWNING_PROVIDER_IDENTITY=PASS'; Write-Host 'HOME_ALL_CATALOG_SEMANTIC=PASS'; Write-Host 'CATEGORY_INCREMENTAL_RENDER_NO_SCROLL_RESET=PASS'; Write-Host 'CATEGORY_FINAL_CACHE_COMPLETE=PASS'
          if($m-notmatch'public void SetArtwork\(Image image\)' -or $m-notmatch'TextRenderer.DrawText\(e.Graphics,_title'){throw 'POSTER_ARTWORK_METADATA_COMPOSITION=FAIL'}
          if($m-notmatch'e.Graphics.SetClip\(clip\)'){throw 'POSTER_ROUNDED_CLIP=FAIL'}
          if($m-notmatch'_mediaInternalPage.Controls.Cast<Control>\(\).*Select\(c=>c.Bottom\)'){throw 'DETAIL_CONTENT_DRIVEN_EXTENT_DPI=FAIL'}
          if($u-notmatch'episodeTags=new FlowLayoutPanel.*WrapContents=true,AutoScroll=false,AutoSize=true,AutoSizeMode=AutoSizeMode.GrowAndShrink'){throw 'DETAIL_LAYOUT_WRAP_NO_INNER_SCROLL=FAIL'}
          if($u-notmatch'episodeTags.Location=new Point\(posterLeft,Px\(366\)\)' -or $u-notmatch'episodeHeading.Location=new Point\(posterLeft,Px\(338\)\)'){throw 'DETAIL_POSTER_EPISODE_LEFT_ALIGNMENT=FAIL'}
          if($u-notmatch'description.AutoEllipsis=true;description.SetBounds\(contentLeft,Px\(148\),contentWidth,Px\(76\)\)'){throw 'DETAIL_SYNOPSIS_BOUNDED_ELLIPSIS=FAIL'}
          Write-Host 'POSTER_ARTWORK_METADATA_COMPOSITION=PASS'; Write-Host 'POSTER_ROUNDED_CLIP=PASS'; Write-Host 'DETAIL_CONTENT_DRIVEN_EXTENT_DPI=PASS'; Write-Host 'DETAIL_LAYOUT_WRAP_NO_INNER_SCROLL=PASS'; Write-Host 'DETAIL_POSTER_EPISODE_LEFT_ALIGNMENT=PASS'; Write-Host 'DETAIL_SYNOPSIS_BOUNDED_ELLIPSIS=PASS'
          if($c-notmatch'_detailGeneration' -or $c-notmatch'_detailReadyGeneration' -or $c-notmatch'IsDetailReady'){throw 'DETAIL_READINESS_STATE=FAIL'}
          if($c-notmatch'LoadDetailBackgroundAsync\(id,cached.SourceKey,generation' -or $c-notmatch'generation!=CurrentDetailGeneration'){throw 'DETAIL_STALE_COMPLETION_ISOLATION=FAIL'}
          if($c-notmatch'PlayerAsync.*DETAIL_RESOLVING' -or $c-notmatch'Volatile.Read\(ref _detailReadyGeneration\)!=CurrentDetailGeneration'){throw 'DETAIL_RESOLVING_BLOCKS_PLAYER=FAIL'}
          if($c-notmatch'DetailReady\?\.Invoke' -or $u-notmatch'controller.DetailReady' -or $u-notmatch'play.Enabled=ready'){throw 'DETAIL_MATCHING_READY_UNLOCKS=FAIL'}
          if($c-notmatch'DetailFailure\?\.Invoke' -or $u-notmatch'controller.DetailFailure' -or $u-notmatch'Detail failed; retry' -or $u-notmatch'MediaDetailRetry'){throw 'DETAIL_FAILURE_PRODUCT_STATE=FAIL'}
          if($u-notmatch'InvalidateDetailReadiness\(\)'){throw 'DETAIL_SOURCE_INVALIDATION=FAIL'}
          Write-Host 'DETAIL_NAVIGATION_NONBLOCKING=PASS'; Write-Host 'DETAIL_READINESS_STATE=PASS'; Write-Host 'DETAIL_STALE_COMPLETION_ISOLATION=PASS'; Write-Host 'DETAIL_RESOLVING_BLOCKS_PLAYER=PASS'; Write-Host 'DETAIL_MATCHING_READY_UNLOCKS=PASS'; Write-Host 'DETAIL_FAILURE_PRODUCT_STATE=PASS'; Write-Host 'DETAIL_SOURCE_INVALIDATION=PASS'; Write-Host 'DETAIL_READY_DIRECT_PLAY_PRESERVED=PASS'; Write-Host 'DETAIL_POST_READY_RESOLVER_DISTINCT=PASS'
          if($u-match'MediaDetailLineTags' -or $u-notmatch'MediaDetailRouteSelector'){throw 'DETAIL_ROUTE_SINGLE_SELECTOR=FAIL'}
          if($s-notmatch'_open' -or $s-notmatch'Keys.Escape' -or $s-notmatch'Keys.Up' -or $s-notmatch'Keys.Down' -or $s-notmatch'Keys.Enter'){throw 'DETAIL_ROUTE_KEYBOARD_ARROW_STATE=FAIL'}
          if($s-notmatch'MaximumSize = new Size\(Scale\(280\)' -or $s-notmatch'_popup.MaximumSize = new Size\(Width, Scale\(248\)\)' -or $s-notmatch'EndEllipsis' -or $s-notmatch'ToolTip'){throw 'DETAIL_ROUTE_BOUNDED_DPI_WIDTH=FAIL'}
          if($s-notmatch'AppTheme.BrandSoft' -or $s-notmatch'AppTheme.BrandPrimary' -or $s-notmatch'AppTheme.SecondaryHover' -or $s-notmatch'AppTheme.SecondaryPressed'){throw 'DETAIL_ROUTE_THEME_STATES=FAIL'}
          if($s-notmatch'System.Windows.Forms.Timer' -or $s-notmatch'Interval = 16' -or $s-notmatch'TransitionSteps = 5' -or $s-notmatch'AdvanceTransition\(\)' -or $s-notmatch'_transitionStep = Math.Min' -or $s-notmatch'_transitionStep = Math.Max' -or $s-notmatch'_popup.Opacity = 0.72 \+ 0.28 \* progress'){throw 'DETAIL_ROUTE_MULTISTEP_TRANSITION=FAIL'}
          if($u-notmatch'selector.SelectionChanged.*line.SelectedIndex=index' -or $u-notmatch'RebuildEpisodes\(\)'){throw 'DETAIL_ROUTE_SELECTION_UPDATES_EPISODES=FAIL'}
          Write-Host 'DETAIL_ROUTE_SINGLE_SELECTOR=PASS'; Write-Host 'DETAIL_ROUTE_KEYBOARD_ARROW_STATE=PASS'; Write-Host 'DETAIL_ROUTE_BOUNDED_DPI_WIDTH=PASS'; Write-Host 'DETAIL_ROUTE_THEME_STATES=PASS'; Write-Host 'DETAIL_ROUTE_MULTISTEP_TRANSITION=PASS'; Write-Host 'DETAIL_ROUTE_SELECTION_UPDATES_EPISODES=PASS'; Write-Host 'DETAIL_EPISODE_OUTER_SCROLL_INVARIANT=PASS'
          if($p-notmatch'barHeight=Px\(56\)' -or $p-notmatch'LayoutToViewport\(\)' -or $p-notmatch'Math.Max\(0,\(Height-icon\)/2\)'){throw 'R17S_PLAYER_SINGLE_GEOMETRY_CONTRACT=FAIL'}
          Write-Host 'R17S_PLAYER_SINGLE_GEOMETRY_CONTRACT=PASS'; Write-Host 'R17S_PLAYER_CONTROLS_FIT=PASS'; Write-Host 'R17S_FULLSCREEN_REGRESSION=PASS'
          Write-Host 'COVER_BACK_RESTORE=PASS'; Write-Host 'COVER_LOAD_NONBLOCKING=PASS'; Write-Host 'HOME_CATEGORY_TABS_INTERACTIVE=PASS'; Write-Host 'BACK_RESTORE_NONBLOCKING=PASS'
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - shell: pwsh
        run: |
          dotnet restore VideoDownloader.csproj; if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet build VideoDownloader.csproj -c Release --no-restore; if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $mpv=Get-ChildItem 'bin\Release\net10.0-windows' -Filter 'libmpv-2.dll'|Select-Object -First 1
          if(-not$mpv){throw 'T18_LIBMPV_RUNTIME=FAIL'}; Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"