name: T90 R3 Dead Owner Exit
on:
  push:
    branches: [ v16-t90-r3-dead-owner-validation ]
    paths: [ '.github/workflows/t90-r3-dead-owner.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 1b43a337664140e2f796eeba6c344eafb3442c58
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          fetch-depth: 0
      - name: Prove dead owner exit
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne '1b43a337664140e2f796eeba6c344eafb3442c58'){throw 'SHA'}
          [string[]]$changed=@(git diff --name-only 0009d791981810afacbcc4301dadc5e572f73b7e HEAD)
          if($changed.Count-ne 1 -or $changed[0]-ne 'Modules/MediaDiscovery/UI/MediaDetailRouteSelector.cs'){throw "SCOPE: $($changed -join ',')"}
          if(Test-Path 'Modules/MediaDiscovery/UI/MediaDetailRouteSelector.cs'){throw 'DEAD OWNER STILL EXISTS'}
          $files=Get-ChildItem -Recurse -File -Include *.cs,*.csproj,*.props,*.targets
          $route=$files|Select-String -SimpleMatch 'MediaDetailRouteSelector'
          if($route){throw "ROUTE SELECTOR REF: $($route.Path -join ',')"}
          $active=@('UI/V14DesignForm.MediaDiscovery.cs','UI/V14DesignForm.MediaDiscovery.CurrentSource.cs','UI/V14DesignForm.HeaderAnimation.cs','UI/Controls/V14ComboBox.cs')
          $src=($active|%{Get-Content $_ -Raw})-join "`n"
          foreach($t in @('ShowCheckMargin','ToolStripMenuItem','PopupRenderer')){if($src.Contains($t)){throw "STALE OWNER $t"}}
          if($src.Contains('发现电影、剧集、动漫及更多内容')){throw 'DUP MEDIA HEADER POLICY'}
          if(-not $src.Contains('Discover movies, series, anime and more')){throw 'FIXED MEDIA HEADER MISSING'}
          if(-not $src.Contains('Name="MediaDetailLine"') -or -not $src.Contains('line.SetBounds(play.Right+Px(18)')){throw 'SHARED LINE OWNER MISSING'}
          Write-Host 'REPOSITORY_REFERENCE_AUDIT=PASS'
          Write-Host 'DEAD_ROUTE_SELECTOR_DELETED=PASS'
          Write-Host 'ACTIVE_DUPLICATE_OWNER_AUDIT=PASS'
          Write-Host 'WINDOWS_VISUAL_PASS_NOT_CLAIMED=TRUE'
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Release build clean
        shell: pwsh
        run: |
          $o=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1
          $o|%{Write-Host $_}
          if($LASTEXITCODE-ne 0){throw 'BUILD'}
          $s=$o-join "`n"
          if($s-notmatch '0 Warning\(s\)' -or $s-notmatch '0 Error\(s\)'){throw 'CLEAN'}
