name: C21A26 Fanout Recovery
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/c21a26-fanout-recovery.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 33a0dfa81b6c754ef7ff40526d7f39e2f8ac331d
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          fetch-depth: 2
      - name: Prove fanout recovery
        shell: pwsh
        run: |
          $source='33a0dfa81b6c754ef7ff40526d7f39e2f8ac331d';$parent='b400d6b7b37f17306ac5c3d49e8b85aa69a67b92'
          if((git rev-parse HEAD).Trim() -ne $source -or (git rev-parse HEAD^).Trim() -ne $parent){throw 'IDENTITY=FAIL'}
          $files=@(git diff --name-only $parent HEAD);$expected=@('Modules/MediaDiscovery/UI/MediaDiscoveryPageNavigation.cs','UI/V14DesignForm.MediaDiscovery.cs','UI/V14DesignForm.MediaDiscovery.CurrentSource.cs')
          if($files.Count -ne 3 -or @($files|?{$_ -notin $expected}).Count){throw 'SCOPE=FAIL'}
          $all=(Get-ChildItem -Recurse -File -Filter '*.cs'|%{Get-Content $_.FullName -Raw}) -join "`n"
          if($all.Contains('_mediaNavigationStack')){throw 'OLD_FANOUT_REMAINS'}
          $page=Get-Content 'UI/V14DesignForm.MediaDiscovery.cs' -Raw;$cur=Get-Content 'UI/V14DesignForm.MediaDiscovery.CurrentSource.cs' -Raw;$owner=Get-Content 'Modules/MediaDiscovery/UI/MediaDiscoveryPageNavigation.cs' -Raw
          foreach($t in @('_mediaPageNavigation.Push(previous)','_mediaPageNavigation.TryPop(out var previous)')){if(-not $page.Contains($t)){throw 'NAV_WIRING=FAIL'}}
          if(-not $cur.Contains('_mediaPageNavigation.Clear();')){throw 'CLEAR_WIRING=FAIL'}
          if(-not $owner.Contains('internal void Clear() => _backStack.Clear();')){throw 'CLEAR_OWNER=FAIL'}
          if(git diff $parent HEAD -- 'Modules/MediaDiscovery/UI/MediaPlayerViewport.cs' 'Modules/MediaDiscovery/UI/MediaIconLibrary.cs' 'Modules/MediaDiscovery/UI/MediaFullscreenHost.cs' 'Modules/MediaDiscovery/LibMpvPlaybackBackend.cs' 'UI/Controls/V14Surface.cs' 'UI/Controls/RoundedPanel.cs'){throw 'FREEZE=FAIL'}
          Write-Host 'FANOUT_COMPLETE=PASS';Write-Host 'SEMANTIC_EQUIVALENCE=PASS';Write-Host 'PAGE_CONTRACT_PRESERVED=PASS';Write-Host 'NO_EXPANSION=PASS';Write-Host 'FREEZE=PASS';Write-Host 'ONE_DELIVERY_COMMIT=PASS'
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore VideoDownloader.csproj
      - name: Release build clean
        shell: pwsh
        run: |
          $o=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1;$o|%{Write-Host $_};if($LASTEXITCODE -ne 0){throw 'BUILD=FAIL'};if(($o-join "`n") -notmatch '0 Warning\(s\)' -or ($o-join "`n") -notmatch '0 Error\(s\)'){throw 'BUILD_CLEAN=FAIL'};Write-Host 'BUILD_CLEAN=PASS'
