name: C21A40R1 MediaDiscovery Corrective
on:
  push:
    branches: [ v16-t88-validation ]
    paths: [ '.github/workflows/c21a40r1.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 9d0464deed52a2133e147dae216f5727f04fd026
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - name: Prove corrective gates
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne '9d0464deed52a2133e147dae216f5727f04fd026'){throw 'SHA'}
          $m=Get-Content UI/V14DesignForm.MediaDiscovery.cs -Raw
          $s=Get-Content UI/V14DesignForm.cs -Raw
          $d=Get-Content UI/Controls/V14ComboBox.cs -Raw
          if(-not $m.Contains('private void ApplyMediaDiscoveryHeader()')){throw 'HEADER_OWNER'}
          if(-not $s.Contains('if (_mediaDiscoveryPage.Visible && _mediaCurrentPage.Kind == MediaPageKind.Home) ApplyMediaDiscoveryHeader();')){throw 'LANGUAGE_ORDER'}
          if(-not $m.Contains('play.SetBounds(Px(220),Px(234),Px(112),AppTheme.ButtonHeight);line.SetBounds(play.Right+gap,Px(234),lineWidth,play.Height)')){throw 'DETAIL_ROW'}
          foreach($t in @('AppTheme.BrandSoft','AppTheme.BrandPrimary','AppTheme.SurfaceHover','ToolStripDropDown','MeasureAdaptiveWidth')){if(-not $d.Contains($t)){throw "SHARED=$t"}}
          foreach($t in @('PlayerAsync(parsed.Flags[selectedLine],ep.Id)','SourceKey','BuildPlayerPage(){DisposeMediaPlayback()')){if(-not $m.Contains($t)){throw "ROUTING=$t"}}
          Write-Host 'FIXED_ENGLISH_BRANDING=PASS'
          Write-Host 'DETAIL_LAYOUT_RESTORE=PASS'
          Write-Host 'SHARED_DROPDOWN=PASS'
          Write-Host 'ROUTING_FREEZE=PASS'
          Write-Host 'MEDIA_DISPLAY_LANGUAGE=BLOCKED_BY_PROVIDER_CONTRACT'
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Release build clean
        shell: pwsh
        run: |
          $o=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1
          $o|%{Write-Host $_}
          if($LASTEXITCODE-ne 0){throw 'BUILD'}
          $s=$o-join "`n"
          if($s-notmatch '0 Warning\(s\)' -or $s-notmatch '0 Error\(s\)'){throw 'CLEAN'}
