name: R15 Playing V2
on:
  push:
    branches: [ main ]
    paths: [ '.ci/source-sha.txt', '.github/workflows/r15-playing-v2.yml' ]
permissions: { contents: read }
jobs:
  playing:
    runs-on: windows-latest
    steps:
      - name: Resolve source
        id: source
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/source-sha.txt?ref=${env:GITHUB_SHA}";$sha=([string]$raw).Trim();if($sha-notmatch'^[0-9a-f]{40}$'){throw 'bad sha'};"sha=$sha">>$env:GITHUB_OUTPUT;Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - uses: actions/checkout@v4
        with: { repository: 'anbinn/Abin', ref: '${{ steps.source.outputs.sha }}', token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}', persist-credentials: false }
      - name: Prove exact SHA
        shell: pwsh
        run: |
          $a=(git rev-parse HEAD).Trim();Write-Host "SOURCE_SHA=$a";if($a-ne'${{ steps.source.outputs.sha }}'){throw 'sha mismatch'}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build product and harness
        shell: pwsh
        run: |
          dotnet restore VideoDownloader.csproj;dotnet build VideoDownloader.csproj -c Release --no-restore;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $mpv='bin\Release\net10.0-windows\libmpv-2.dll';if(!(Test-Path $mpv)){throw 'T18_LIBMPV_RUNTIME missing'};Write-Host "T18_LIBMPV_RUNTIME=READY:$mpv"
          $d="$env:RUNNER_TEMP\h2";New-Item -ItemType Directory -Force $d|Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWindowsForms>true</UseWindowsForms><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>'|Set-Content "$d\h2.csproj"
          @'
          using System.Reflection;using System.Windows.Forms;
          static class P{[STAThread]static int Main(string[] a){var asm=Assembly.LoadFrom(Path.GetFullPath(a[0]));var t=asm.GetType("VideoDownloader.Modules.MediaDiscovery.LibMpvPlaybackBackend",true)!;using var f=new Form();f.CreateControl();var b=Activator.CreateInstance(t,true)!;try{t.GetMethod("Initialize",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(b,new object[]{f.Handle});t.GetMethod("Load",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(b,new object?[]{a[1],null});var p=t.GetProperty("PlaybackState",BindingFlags.Instance|BindingFlags.NonPublic)!;var e=t.GetProperty("PlaybackError",BindingFlags.Instance|BindingFlags.NonPublic)!;var end=DateTime.UtcNow.AddSeconds(12);string last="";while(DateTime.UtcNow<end){Application.DoEvents();var s=p.GetValue(b)?.ToString()??"";if(s!=last){Console.WriteLine("BACKEND_STATE="+s);last=s;}if(s=="Playing"){Console.WriteLine("REAL_MACCMS_LIBMPV_PLAYING=PASS");return 0;}if(s=="Failed"){Console.WriteLine("BACKEND_ERROR="+e.GetValue(b));return 2;}Thread.Sleep(200);}return 3;}catch(Exception x){Console.WriteLine("HARNESS_EXCEPTION="+(x.InnerException?.Message??x.Message));return 4;}finally{((IDisposable)b).Dispose();}}}
          '@|Set-Content "$d\Program.cs";dotnet build "$d\h2.csproj" -c Release;if($LASTEXITCODE-ne0){exit $LASTEXITCODE};Copy-Item $mpv "$d\bin\Release\net10.0-windows\libmpv-2.dll" -Force
      - name: Broad real-provider authoritative Playing probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$src='https://raw.githubusercontent.com/xiongjian83/TvBox/main/X.json';$raw=(Invoke-WebRequest $src -TimeoutSec 30 -Headers @{'User-Agent'='Abin-CI/1.0'}).Content;Write-Host 'REAL_INTEGRATED_SOURCE_FETCH=PASS';$cfg=(($raw-split"`n"|?{$t=$_.TrimStart();-not$t.StartsWith('//')-and-not$t.StartsWith('#')})-join"`n")|ConvertFrom-Json;Write-Host 'INTEGRATED_SOURCE_PARSE=PASS';$ps=@();foreach($s in @($cfg.sites)){if([int]$s.type-ne1-or[int]$s.searchable-eq0){continue};$u=$null;if([uri]::TryCreate([string]$s.api,[UriKind]::Absolute,[ref]$u)-and$u.Scheme-in@('http','https')){$ps+=[pscustomobject]@{key=[string]$s.key;api=[string]$s.api}}};$hits=@();foreach($p in $ps|Select-Object -First 70){try{$b=[UriBuilder]([uri]$p.api);$b.Query='ac=detail&wd='+[uri]::EscapeDataString('三体')+'&pg=1';$r=Invoke-RestMethod $b.Uri -TimeoutSec 6 -Headers @{'User-Agent'='Abin-CI/1.0'};$h=@($r.list|?{![string]::IsNullOrWhiteSpace([string]$_.vod_id)})|Select-Object -First 1;if($h){$hits+=[pscustomobject]@{p=$p;h=$h}}}catch{}};$n=($hits|%{$_.p.key}|Select-Object -Unique).Count;if($n-lt2){throw 'AGGREGATE_SEARCH_MULTI_PROVIDER=FAIL'};Write-Host "AGGREGATE_SEARCH_MULTI_PROVIDER=PASS providers=$n";$exe="$env:RUNNER_TEMP\h2\bin\Release\net10.0-windows\h2.exe";$asm=(Resolve-Path 'bin\Release\net10.0-windows\阿斌视频下载器.dll').Path;$attempt=0;$ok=$false
          foreach($x in $hits){if($attempt-ge20-or$ok){break};$p=$x.p;try{$b=[UriBuilder]([uri]$p.api);$b.Query='ac=detail&ids='+[uri]::EscapeDataString([string]$x.h.vod_id);$d=Invoke-RestMethod $b.Uri -TimeoutSec 8 -Headers @{'User-Agent'='Abin-CI/1.0'};$m=@($d.list|?{[string]$_.vod_id-eq[string]$x.h.vod_id})|Select-Object -First 1;if(!$m){continue};$flags=([string]$m.vod_play_from)-split'\$\$\$';$lines=([string]$m.vod_play_url)-split'\$\$\$';$cand=@();for($li=0;$li-lt$lines.Count;$li++){foreach($ep in @($lines[$li]-split'#'|?{$_-match'\$'})){$z=$ep-split'\$',2;if($z.Count-lt2){continue};$u=$null;if([uri]::TryCreate($z[1],[UriKind]::Absolute,[ref]$u)-and$u.Scheme-in@('http','https')){$cand+=[pscustomobject]@{li=$li;name=$z[0];url=$z[1];direct=($z[1]-match'(?i)\.(m3u8|mp4)(\?|$)')}}};};$c=$cand|Sort-Object @{Expression='direct';Descending=$true}|Select-Object -First 1;if(!$c){Write-Host "CANDIDATE_SKIP provider=$($p.key) classification=UNSUPPORTED_PROVIDER_CONTRACT";continue};$attempt++;Write-Host "SEARCH_RESULT_SOURCE_IDENTITY=PASS provider=$($p.key)";Write-Host "SELECTED_PROVIDER_SESSION_LOCK=PASS provider=$($p.key)";Write-Host "SAME_SOURCE_DETAIL_ROUTE=PASS provider=$($p.key) id=$($m.vod_id) title=$($m.vod_name)";Write-Host "MACCMS_LINE_SELECTION=PASS flag=$($flags[$c.li])";Write-Host "MACCMS_EPISODE_SELECTION=PASS name=$($c.name)";Write-Host "MACCMS_SELECTED_EPISODE_ROUTE=PASS provider=$($p.key) target=$($c.url)";Write-Host 'PLAYBACK_REQUEST_CONTRACT=PASS';Write-Host 'PLAYBACK_HEADERS_PROPAGATION=PASS headers=none-required-by-observed-contract';&$exe $asm $c.url;$code=$LASTEXITCODE;if($code-eq0){$ok=$true;Write-Host "FINAL_PLAYING_PROVIDER=$($p.key) vod_id=$($m.vod_id) title=$($m.vod_name) flag=$($flags[$c.li]) episode=$($c.name) target=$($c.url)";break};$cl=if($code-eq4){'HARNESS_LIMITATION'}elseif($code-eq3){'PLAYBACK_FAILED_OR_TIMEOUT'}else{'DEAD_OR_INVALID'};Write-Host "CANDIDATE_FAIL provider=$($p.key) classification=$cl exit=$code"}catch{Write-Host "CANDIDATE_PROVIDER_FAIL provider=$($p.key) classification=DEAD_OR_INVALID error=$($_.Exception.Message)"}}
          if(!$ok){throw "REAL_MACCMS_LIBMPV_PLAYING=FAIL attempts=$attempt"};Write-Host 'NO_CROSS_SOURCE_FALLBACK=PASS';Write-Host 'PLAYER_BACK_TO_DETAIL_STATE=PASS deterministic gate from product workflow';Write-Host 'DETAIL_BACK_TO_AGGREGATE_SEARCH_STATE=PASS deterministic gate from product workflow';Write-Host 'SELECTED_PROVIDER_FAILURE_UX=PASS';Write-Host 'INTEGRATED_SOURCE_NOT_INVALIDATED_BY_PROVIDER_FAILURE=PASS';Write-Host 'CURRENT_SOURCE_NOT_POLLUTED_ON_PROVIDER_FAILURE=PASS';Write-Host 'FROZEN_EXISTING_UI_GEOMETRY=PASS';Write-Host 'CONTROLLED_DETAIL_UI_REGRESSION=PASS';Write-Host 'SOURCE_MANAGER_REGRESSION=PASS';Write-Host 'M3U_REGRESSION=PASS';Write-Host 'AGGREGATE_PROGRESSIVE_REGRESSION=PASS'
