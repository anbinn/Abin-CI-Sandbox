name: C21A24 Player Visual Ownership Consolidation
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/c21a24-player-visual-owner.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout exact private Abin source
        uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 2db165079cfe2b949e578c590679e99be75149d9
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          fetch-depth: 2
      - name: Prove C21A24 ownership contract
        shell: pwsh
        run: |
          $source='2db165079cfe2b949e578c590679e99be75149d9'; $baseline='ac2aa9a3779611bd897754b771bc527de720ff3c'
          $actual=(git rev-parse HEAD).Trim(); $parent=(git rev-parse HEAD^).Trim()
          Write-Host "SOURCE_SHA=$actual"; Write-Host "PARENT_SHA=$parent"
          if($actual -ne $source -or $parent -ne $baseline){throw 'C21A24_IDENTITY=FAIL'}
          $files=@(git diff --name-only $baseline HEAD)
          if($files.Count -ne 1 -or $files[0] -ne 'Modules/MediaDiscovery/UI/MediaPlayerViewport.cs'){throw 'C21A24_SCOPE=FAIL'}
          $src=Get-Content 'Modules/MediaDiscovery/UI/MediaPlayerViewport.cs' -Raw
          if($src.Contains('class MediaDiscoveryClosedSurface')){throw 'C21A24_OLD_OWNER_EXIT=FAIL'}
          foreach($token in @('class MediaPlayerViewport:V14Surface','BorderThickness=0','ShadowSize=0','ClipContentToRoundedSurface=true','CornerRadius=AppTheme.CardRadius','BackColor=Color.Black','SmoothingMode=SmoothingMode.AntiAlias','Region=new Region(path)','Dock=DockStyle.Fill','Parent is MediaFullscreenHost host?host.BackColor:AppTheme.PageBackground')){if(-not $src.Contains($token)){throw "C21A24_OWNER=FAIL $token"}}
          foreach($bad in @('PixelOffsetMode','HighQuality','UseClosedRegion=false')){if($src.Contains($bad)){throw "C21A24_STYLE_STACKING=FAIL $bad"}}
          $pageDiff=git diff $baseline HEAD -- 'UI/V14DesignForm.MediaDiscovery.cs'; if($pageDiff){throw 'C21A24_PARENT_LAYOUT=FAIL'}
          $hostDiff=git diff $baseline HEAD -- 'Modules/MediaDiscovery/UI/MediaFullscreenHost.cs'; if($hostDiff){throw 'C21A24_FULLSCREEN=FAIL'}
          $backendDiff=git diff $baseline HEAD -- 'Modules/MediaDiscovery/LibMpvPlaybackBackend.cs'; if($backendDiff){throw 'C21A24_LIBMPV=FAIL'}
          $sharedDiff=git diff $baseline HEAD -- 'UI/Controls/RoundedPanel.cs' 'UI/Controls/V14Surface.cs'; if($sharedDiff){throw 'C21A24_SHARED=FAIL'}
          Write-Host 'C21A24_ONE_COMMIT=PASS'
          Write-Host 'C21A24_SCOPE=PASS'
          Write-Host 'C21A24_UNIQUE_PLAYER_OWNER=PASS'
          Write-Host 'C21A24_OLD_OWNER_EXIT=PASS'
          Write-Host 'C21A24_PARENT_LAYOUT_ONLY=PASS'
          Write-Host 'C21A24_CHILD_ISOLATION=PASS'
          Write-Host 'C21A24_SHARED_PRIMITIVE_FREEZE=PASS'
          Write-Host 'C21A24_VISUAL_FREEZE=PASS'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Release build clean
        shell: pwsh
        run: |
          $output=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if($LASTEXITCODE -ne 0){throw 'C21A24_BUILD=FAIL'}
          if(($output -join "`n") -notmatch '0 Warning\(s\)' -or ($output -join "`n") -notmatch '0 Error\(s\)'){throw 'C21A24_BUILD_CLEAN=FAIL'}
          Write-Host 'C21A24_BUILD_CLEAN=PASS'
