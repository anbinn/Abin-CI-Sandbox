name: T91 R6 Square ControlBar Validation
on:
 push:
  branches: [ v16-t91-r6-square-controlbar-validation ]
  paths: [ '.github/workflows/t91-r6-rounded.yml' ]
permissions: { contents: read }
jobs:
 validate:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
     with:
      repository: anbinn/Abin
      ref: ec7e288234f4efc3d00bc19eeb69ecb3f7dbc40f
      token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
      persist-credentials: false
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: '10.0.x' }
   - name: Exact product SHA
     shell: pwsh
     run: |
      $actual=(git rev-parse HEAD).Trim()
      Write-Host "PRODUCT_SOURCE_SHA=$actual"
      if($actual -ne 'ec7e288234f4efc3d00bc19eeb69ecb3f7dbc40f'){throw "SOURCE_SHA_MISMATCH $actual"}
      Write-Host "PRODUCT_SOURCE_SHA_MATCH=PASS"
   - run: dotnet restore VideoDownloader.csproj
   - name: Release build clean
     shell: pwsh
     run: |
      $o=dotnet build VideoDownloader.csproj -c Release --no-restore 2>&1
      $o|%{Write-Host $_}
      if($LASTEXITCODE-ne 0){throw 'BUILD'}
      $s=$o-join "`n"
      if($s-notmatch '0 Warning\(s\)' -or $s-notmatch '0 Error\(s\)'){throw 'CLEAN'}
   - name: Detail navigation ordering gate
     shell: pwsh
     run: |
      $s=Get-Content 'UI/V14DesignForm.MediaDiscovery.cs' -Raw
      $start=$s.IndexOf('private Control CreatePoster')
      $end=$s.IndexOf('private static (string[] Flags',$start)
      if($start-lt 0 -or $end-lt 0){throw 'CREATE_POSTER_BLOCK_MISSING'}
      $block=$s.Substring($start,$end-$start)
      $push=$block.IndexOf('PushMediaPage(new(MediaPageKind.Detail,keyword,item));')
      $resolve=$block.IndexOf('ResolveMediaDetailAfterNavigationAsync(item,keyword)')
      if($push-lt 0 -or $resolve-lt 0 -or $push-ge $resolve){throw 'DETAIL_NAVIGATION_NOT_FIRST'}
      if($block -match 'await\s+_mediaController.*DetailAsync'){throw 'DETAIL_CLICK_STILL_BLOCKING'}
      Write-Host 'DETAIL_NAVIGATION_FIRST=PASS'
      Write-Host 'DETAIL_BACKGROUND_RESOLVE=PASS'
   - name: Square control bar source gate
     shell: pwsh
     run: |
      $s=Get-Content 'Modules/MediaDiscovery/UI/MediaPlayerViewport.cs' -Raw
      $start=$s.IndexOf('internal sealed class MediaPlayerControlBar')
      if($start-lt 0){throw 'CONTROL_BAR_MISSING'}
      $bar=$s.Substring($start)
      foreach($token in @('CreateSurfacePath','CreateWindowClipPath','UpdateWindowClip','ControlContourColor','Region=new Region','Px(14)')){if($bar.Contains($token)){throw "STALE_ROUNDED_CONTROLBAR_TOKEN $token"}}
      if($bar-notmatch 'ControlSurfaceColor=Color.FromArgb\(41,45,54\)'){throw 'CONTROL_SURFACE_COLOR_CHANGED'}
      Write-Host 'SQUARE_CONTROLBAR_SOURCE=PASS'
   - name: Runtime player square-bar harness
     shell: pwsh
     run: |
      $src=@'
      using System;using System.Drawing;using System.Reflection;using System.Windows.Forms;
      class H{[STAThread]static void Main(){
       var product=System.IO.Path.GetFullPath("bin/Release/net10.0-windows/阿斌视频下载器.dll");
       if(!System.IO.File.Exists(product))throw new Exception("PRODUCT_ASSEMBLY_MISSING");
       var asm=Assembly.LoadFrom(product);
       Type T(string n)=>asm.GetType("VideoDownloader.UI.Controls."+n,true)!;
       object New(Type t)=>Activator.CreateInstance(t,BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic,null,null,null)!;
       object NewIcon(string icon){var et=T("MediaVectorIcon");var ev=Enum.Parse(et,icon);return Activator.CreateInstance(T("MediaIconButton"),BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic,null,new object[]{ev},null)!;}
       var form=new Form(){Size=new Size(900,600)};
       var vp=(Control)New(T("MediaPlayerViewport"));vp.Dock=DockStyle.Fill;form.Controls.Add(vp);
       var bar=(Control)New(T("MediaPlayerControlBar"));vp.Controls.Add(bar);
       Control Add(string type,string name,string? icon=null){var c=(Control)(type=="MediaIconButton"?NewIcon(icon!):New(T(type)));c.Name=name;bar.Controls.Add(c);return c;}
       var play=Add("MediaIconButton","MediaPlayerPlay","Pause");
       Add("V14SeekProgress","MediaPlayerSeek");
       bar.Controls.Add(new Label(){Name="MediaPlayerTime",Text="00:00 / 00:00"});
       Add("MediaIconButton","MediaPlayerVolume","Volume");
       Add("MediaIconButton","MediaPlayerFullscreen","Fullscreen");
       form.Show();Application.DoEvents();
       bar.GetType().GetMethod("LayoutToViewport",BindingFlags.Instance|BindingFlags.NonPublic|BindingFlags.Public)!.Invoke(bar,null);
       Application.DoEvents();
       if(form.Handle==IntPtr.Zero||vp.Handle==IntPtr.Zero||bar.Handle==IntPtr.Zero)throw new Exception("HANDLE_ZERO");
       if(bar.Region is not null)throw new Exception("BAR_REGION_SHOULD_BE_NULL");
       if(play.Region is not null)throw new Exception("BINARY_ICON_REGION_PRESENT");
       var expected=Color.FromArgb(41,45,54);
       if(bar.BackColor.ToArgb()!=expected.ToArgb())throw new Exception("SURFACE_COLOR");
       using(var bmp=new Bitmap(bar.Width,bar.Height)){
        using var g=Graphics.FromImage(bmp);g.Clear(Color.Magenta);
        using var pe=new PaintEventArgs(g,new Rectangle(Point.Empty,bar.Size));
        bar.GetType().GetMethod("OnPaintBackground",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(bar,new object[]{pe});
        bar.GetType().GetMethod("OnPaint",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(bar,new object[]{pe});
        if(bmp.GetPixel(bar.Width/2,bar.Height/2).ToArgb()!=expected.ToArgb())throw new Exception("BAR_CENTER_NOT_SURFACE");
        if(bmp.GetPixel(bar.Width/2,bar.Height/2).ToArgb()!=expected.ToArgb())throw new Exception("BAR_PAINT_MISMATCH");
       }
       using(var bmp=new Bitmap(play.Width,play.Height)){
        using var g=Graphics.FromImage(bmp);g.Clear(Color.Magenta);
        using var pe=new PaintEventArgs(g,new Rectangle(Point.Empty,play.Size));
        play.GetType().GetMethod("OnPaintBackground",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(play,new object[]{pe});
        play.GetType().GetMethod("OnPaint",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(play,new object[]{pe});
        if(bmp.GetPixel(0,0).ToArgb()!=expected.ToArgb())throw new Exception("ICON_CORNER_NOT_HOST_SURFACE");
       }
       var renderHandle=(IntPtr)vp.GetType().GetProperty("RenderWindowHandle",BindingFlags.Instance|BindingFlags.NonPublic|BindingFlags.Public)!.GetValue(vp)!;
       if(renderHandle==IntPtr.Zero)throw new Exception("RENDER_HANDLE_ZERO");
       var bt=asm.GetType("VideoDownloader.Modules.MediaDiscovery.LibMpvPlaybackBackend",true)!;
       var backend=Activator.CreateInstance(bt,BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic,null,null,null)!;
       bt.GetMethod("Initialize",BindingFlags.Instance|BindingFlags.NonPublic|BindingFlags.Public)!.Invoke(backend,new object[]{renderHandle});
       if(!(bool)bt.GetProperty("IsReady",BindingFlags.Instance|BindingFlags.NonPublic|BindingFlags.Public)!.GetValue(backend)!)throw new Exception("LIBMPV_NOT_READY");
       ((IDisposable)backend).Dispose();
       Console.WriteLine("SQUARE_BAR_NO_REGION=PASS");
       Console.WriteLine("NO_BINARY_ICON_REGION=PASS");
       Console.WriteLine("SQUARE_BAR_SURFACE_PAINT=PASS");
       Console.WriteLine("AA_ICON_PAINT=PASS");
       Console.WriteLine("LIBMPV_INITIALIZE=PASS");
       form.Close();form.Dispose();Application.DoEvents();Console.WriteLine("DISPOSE=PASS");
      }}
      '@
      New-Item -ItemType Directory -Force .runtime-harness|Out-Null
      Set-Content .runtime-harness/H.cs $src
      Set-Content .runtime-harness/H.csproj '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWindowsForms>true</UseWindowsForms><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>'
      $productDir=(Resolve-Path 'bin/Release/net10.0-windows').Path
      $env:PATH="$productDir;$env:PATH"
      dotnet run --project .runtime-harness/H.csproj -c Release
      if($LASTEXITCODE-ne 0){throw 'HARNESS'}
