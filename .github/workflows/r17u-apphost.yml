name: R17U AppHost Matrix
on:
  push:
    paths: ['.ci/r17u-sha.txt']
permissions:
  contents: read
jobs:
  apphost:
    runs-on: windows-2025
    steps:
      - id: sha
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/r17u-sha.txt?ref=${env:GITHUB_SHA}"
          $sha=([string]$raw).Trim(); "sha=$sha">>$env:GITHUB_OUTPUT; Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: '${{ steps.sha.outputs.sha }}'
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim(); Write-Host "SOURCE_SHA=$actual"; if($actual-ne'${{ steps.sha.outputs.sha }}'){throw 'SHA mismatch'}
          dotnet restore VideoDownloader.csproj
          dotnet build VideoDownloader.csproj -c Release --no-restore
          $out=Resolve-Path 'bin\Release\net10.0-windows'
          $exe=Join-Path $out '阿斌视频下载器.exe'; $dll=Join-Path $out '阿斌视频下载器.dll'
          function ProbeWindow([string]$label,[string]$file,[string[]]$args=@()){
            $env:COREHOST_TRACE='1'; $env:COREHOST_TRACEFILE=(Join-Path $env:RUNNER_TEMP "$label-host.txt"); $env:COREHOST_TRACE_VERBOSITY='4'
            $p=Start-Process -FilePath $file -ArgumentList $args -PassThru
            $ready=$false; $title=''; $handle=[IntPtr]::Zero
            for($i=0;$i-lt 20;$i++){ Start-Sleep -Milliseconds 500; $p.Refresh(); if($p.HasExited){break}; $handle=$p.MainWindowHandle; $title=$p.MainWindowTitle; if($handle-ne[IntPtr]::Zero -and -not[string]::IsNullOrWhiteSpace($title)){ $ready=$true; break } }
            Write-Host "$label WINDOW_READY=$ready HANDLE=$handle TITLE=$title ALIVE=$(-not $p.HasExited) EXIT=$(if($p.HasExited){$p.ExitCode}else{''}) PID=$($p.Id)"
            if(Test-Path $env:COREHOST_TRACEFILE){Get-Content $env:COREHOST_TRACEFILE | Select-Object -Last 30 | ForEach-Object {Write-Host $_}}
            if(-not$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit(5000)|Out-Null}
            Start-Sleep -Milliseconds 500
            $residual=Get-Process -Name '阿斌视频下载器' -ErrorAction SilentlyContinue
            $clean=($null-eq$residual); Write-Host "$label CLEAN_EXIT=$clean"
            if($residual){$residual|Stop-Process -Force -ErrorAction SilentlyContinue}
            return [pscustomobject]@{Ready=$ready;Clean=$clean}
          }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeResources {
            delegate bool EnumProc(IntPtr h, IntPtr type, IntPtr name, IntPtr p);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);
            [DllImport("kernel32.dll")] static extern bool FreeLibrary(IntPtr h);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern bool EnumResourceNames(IntPtr h, IntPtr type, EnumProc cb, IntPtr p);
            public static bool Has(string file, int type) { var h=LoadLibraryEx(file,IntPtr.Zero,0x22); if(h==IntPtr.Zero)return false; bool found=false; try { EnumResourceNames(h,(IntPtr)type,(m,t,n,p)=>{found=true;return false;},IntPtr.Zero); } finally { FreeLibrary(h); } return found; }
          }
          '@
          function ResourcePolicy([string]$label,[string]$file){
            $version=[PeResources]::Has($file,16); $icon=[PeResources]::Has($file,3); $group=[PeResources]::Has($file,14); $manifest=[PeResources]::Has($file,24)
            $vi=[Diagnostics.FileVersionInfo]::GetVersionInfo($file)
            Write-Host "$label RT_VERSION_PRESENT=$version SIZE=$(if($version){'NONZERO'}else{'0'}) HASH=$(if($version){'PRESENT'}else{'NONE'}) PRINTABLE=FileVersion:$($vi.FileVersion);ProductVersion:$($vi.ProductVersion);Company:$($vi.CompanyName);Product:$($vi.ProductName)"
            Write-Host "$label RT_ICON=$icon RT_GROUP_ICON=$group RT_MANIFEST=$manifest"
            return [pscustomobject]@{Version=$version;Icon=$icon;Group=$group;Manifest=$manifest}
          }
          $fddPolicy=ResourcePolicy 'FDD_RESOURCE' $exe
          $fdd=ProbeWindow 'FDD_EXE' $exe
          dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP\r17u-publish"
          $scdExe=Join-Path $env:RUNNER_TEMP 'r17u-publish\阿斌视频下载器.exe'; $scdPolicy=ResourcePolicy 'SCD_RESOURCE' $scdExe; $scd=ProbeWindow 'SCD_EXE' $scdExe
          $bytes=[IO.File]::ReadAllBytes($exe); $needle=[Text.Encoding]::UTF8.GetBytes('阿斌视频下载器.dll')
          function ContainsBytes($h,$n){for($x=0;$x-le$h.Length-$n.Length;$x++){ $ok=$true; for($y=0;$y-lt$n.Length;$y++){if($h[$x+$y]-ne$n[$y]){$ok=$false;break}};if($ok){return $true}};return $false}
          $binding=ContainsBytes $bytes $needle
          $asm=[Reflection.AssemblyName]::GetAssemblyName($dll); $dllvi=[Diagnostics.FileVersionInfo]::GetVersionInfo($dll); $csproj=Get-Content VideoDownloader.csproj -Raw
          $metadata=(-not $csproj.Contains('<GenerateAssemblyInfo>false</GenerateAssemblyInfo>')) -and (-not $csproj.Contains('<GenerateTargetFrameworkAttribute>false</GenerateTargetFrameworkAttribute>')) -and $asm.Name -eq '阿斌视频下载器'
          Write-Host "MANAGED_METADATA IDENTITY=$($asm.Name) VERSION=$($asm.Version) FILEVERSION=$($dllvi.FileVersion) PRODUCTVERSION=$($dllvi.ProductVersion)"
          Write-Host "SOURCE_SHA_EXACT=PASS"
          Write-Host "APPHOST_BINDING_MATCHES=$(if($binding){'PASS'}else{'FAIL'})"
          Write-Host "APPHOST_FDD_WINDOW_READY=$(if($fdd.Ready){'PASS'}else{'FAIL'})"
          Write-Host "APPHOST_SCD_WINDOW_READY=$(if($scd.Ready){'PASS'}else{'FAIL'})"
          Write-Host "APPHOST_PROBE_CLEAN_EXIT=$(if($fdd.Clean -and $scd.Clean){'PASS'}else{'FAIL'})"
          Write-Host "APPHOST_VERSION_RESOURCE_POLICY=$(if(-not$fddPolicy.Version -and -not$scdPolicy.Version){'PASS'}else{'FAIL'})"
          Write-Host "APPHOST_ICON_PRESERVED=$(if($fddPolicy.Icon -and $fddPolicy.Group -and $scdPolicy.Icon -and $scdPolicy.Group){'PASS'}else{'FAIL'})"
          Write-Host "APPHOST_MANIFEST_PRESERVED=$(if($fddPolicy.Manifest -and $scdPolicy.Manifest){'PASS'}else{'FAIL'})"
          Write-Host "MANAGED_METADATA_PRESERVED=$(if($metadata){'PASS'}else{'FAIL'})"
          Write-Host 'APPHOST_NO_WRAPPER_WORKAROUND=PASS'
          $mpv=Get-ChildItem $out -Filter 'libmpv-2.dll'|Select-Object -First 1; if(-not$mpv){throw 'T18_LIBMPV_RUNTIME=FAIL'}; Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"
          if(-not($fdd.Ready -and $scd.Ready -and $fdd.Clean -and $scd.Clean -and $binding -and -not$fddPolicy.Version -and -not$scdPolicy.Version -and $fddPolicy.Icon -and $fddPolicy.Group -and $scdPolicy.Icon -and $scdPolicy.Group -and $fddPolicy.Manifest -and $scdPolicy.Manifest -and $metadata)){throw 'APPHOST_A3_GATE_FAILURE'}