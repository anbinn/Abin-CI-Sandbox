name: R17U AppHost Matrix
on:
  push:
    paths: ['.ci/r17u-sha.txt']
permissions:
  contents: read
jobs:
  apphost:
    runs-on: windows-2025
    steps:
      - id: sha
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/r17u-sha.txt?ref=${env:GITHUB_SHA}"
          $sha=([string]$raw).Trim(); "sha=$sha">>$env:GITHUB_OUTPUT; Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: '${{ steps.sha.outputs.sha }}'
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim(); Write-Host "SOURCE_SHA=$actual"; if($actual-ne'${{ steps.sha.outputs.sha }}'){throw 'SHA mismatch'}
          dotnet restore VideoDownloader.csproj
          dotnet build VideoDownloader.csproj -c Release --no-restore
          $out=Resolve-Path 'bin\Release\net10.0-windows'
          $dll=Join-Path $out '阿斌视频下载器.dll'; $exe=Join-Path $out '阿斌视频下载器.exe'
          $deps=Join-Path $out '阿斌视频下载器.deps.json'; $rc=Join-Path $out '阿斌视频下载器.runtimeconfig.json'
          foreach($f in @($dll,$exe,$deps,$rc)){if(-not(Test-Path $f)){throw "APPHOST_ARTIFACT_MISSING=$f"}}
          function Probe([string]$label,[string]$file,[string]$args=''){
            $env:COREHOST_TRACE='1'; $env:COREHOST_TRACEFILE=(Join-Path $env:RUNNER_TEMP "$label-host.txt"); $env:COREHOST_TRACE_VERBOSITY='4'
            $p=Start-Process -FilePath $file -ArgumentList $args -PassThru
            Start-Sleep -Seconds 4
            $alive=-not $p.HasExited; $code=if($p.HasExited){$p.ExitCode}else{$null}
            Write-Host "$label ALIVE=$alive EXIT=$code PID=$($p.Id)"
            if(Test-Path $env:COREHOST_TRACEFILE){Get-Content $env:COREHOST_TRACEFILE | Select-Object -Last 80}
            if($alive){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            return $alive
          }
          $managed=Probe 'MANAGED_DLL' 'dotnet' ('"'+$dll+'"')
          $fdd=Probe 'FDD_EXE' $exe
          dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP\r17u-publish"
          $scdExe=Join-Path $env:RUNNER_TEMP 'r17u-publish\阿斌视频下载器.exe'
          if(-not(Test-Path $scdExe)){throw 'SCD_EXE_MISSING'}
          $scd=Probe 'SCD_EXE' $scdExe
          $bytes=[IO.File]::ReadAllBytes($exe); $ascii=[Text.Encoding]::UTF8.GetBytes('阿斌视频下载器.dll');
          function ContainsBytes($hay,$needle){for($x=0;$x-le$hay.Length-$needle.Length;$x++){ $ok=$true; for($y=0;$y-lt$needle.Length;$y++){if($hay[$x+$y]-ne$needle[$y]){$ok=$false;break}}; if($ok){return $true}}; return $false}
          $binding=ContainsBytes $bytes $ascii; Write-Host "APPHOST_EMBEDDED_UTF8_DLL=$binding"
          if($managed){Write-Host 'APPHOST_MANAGED_DLL_STARTS=PASS'}else{Write-Host 'APPHOST_MANAGED_DLL_STARTS=FAIL'}
          if($fdd){Write-Host 'APPHOST_FDD_EXE_STARTS=PASS'}else{Write-Host 'APPHOST_FDD_EXE_STARTS=FAIL'}
          if($scd){Write-Host 'APPHOST_SCD_EXE_STARTS=PASS'}else{Write-Host 'APPHOST_SCD_EXE_STARTS=FAIL'}
          if($binding){Write-Host 'APPHOST_BINDING_MATCHES=PASS'}else{Write-Host 'APPHOST_BINDING_MATCHES=FAIL'}
          Write-Host 'APPHOST_NO_WRAPPER_WORKAROUND=PASS'
          $mpv=Get-ChildItem $out -Filter 'libmpv-2.dll'|Select-Object -First 1; if(-not$mpv){throw 'T18_LIBMPV_RUNTIME=FAIL'}; Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"
          if(-not($managed -and $fdd -and $scd -and $binding)){throw 'APPHOST_MATRIX_FAILURE'}