name: C21A17 Frame Aspect Probe
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/c21a17-frame-aspect-probe.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout exact private Abin source
        uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: e779505ed0f9b8a774db7719a3be61c53617aa03
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          fetch-depth: 2
      - name: Prove exact SHA parent scope and diagnostic contract
        shell: pwsh
        run: |
          $expected='e779505ed0f9b8a774db7719a3be61c53617aa03'; $baseExpected='5b8138693c33bffa143badee26014481d32195a8'
          $actual=(git rev-parse HEAD).Trim(); $base=(git rev-parse HEAD^).Trim()
          Write-Host "SOURCE_SHA=$actual"; Write-Host "PARENT_SHA=$base"
          if($actual -ne $expected -or $base -ne $baseExpected){throw 'C21A17_EXACT_SOURCE=FAIL'}
          $files=@(git diff --name-only $base HEAD)
          if($files.Count -ne 1 -or $files[0] -ne 'Modules/MediaDiscovery/LibMpvPlaybackBackend.cs'){throw "C21A17_SCOPE=FAIL $($files -join ',')"}
          $backend=Get-Content 'Modules/MediaDiscovery/LibMpvPlaybackBackend.cs' -Raw
          foreach($token in @('FrameProbe hostClient=','width=','height=','dwidth=','dheight=','video-params/aspect=','video-params/par=','keepaspect=','video-unscaled=','panscan=','video-aspect-override=','unavailable','GetClientRect')){if(-not $backend.Contains($token)){throw "C21A17_PROBE_TOKEN=FAIL $token"}}
          $patch=(git diff $base HEAD -- 'Modules/MediaDiscovery/LibMpvPlaybackBackend.cs') -join "`n"
          foreach($bad in @('mpv_set_option_string(handle, "keepaspect"','mpv_set_option_string(handle, "video-unscaled"','mpv_set_option_string(handle, "panscan"','mpv_set_option_string(handle, "video-aspect-override"','BackColor=','Dock=','SetBounds','Region=','CornerRadius=')){if($patch -match ('^\+.*'+[regex]::Escape($bad))){throw "C21A17_BEHAVIOR_VISUAL=FAIL $bad"}}
          Write-Host 'C21A17_ONE_COMMIT=PASS'; Write-Host 'C21A17_SCOPE=PASS'; Write-Host 'C21A17_FRAME_DATA=PASS'; Write-Host 'C21A17_EFFECTIVE_FITTING=PASS'; Write-Host 'C21A17_HOST_PAIRING=PASS'; Write-Host 'C21A17_NO_BEHAVIOR_CHANGE=PASS'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Release build clean
        shell: pwsh
        run: |
          $output=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if($LASTEXITCODE -ne 0){throw 'C21A17_BUILD=FAIL'}
          if(($output -join "`n") -notmatch '0 Warning\(s\)' -or ($output -join "`n") -notmatch '0 Error\(s\)'){throw 'C21A17_BUILD_CLEAN=FAIL'}
          Write-Host 'C21A17_BUILD_CLEAN=PASS'
