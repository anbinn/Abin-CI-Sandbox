name: Abin Private CI
on:
  workflow_dispatch:
    inputs:
      source_sha: { description: 'Exact private Abin commit SHA to validate', required: true }
  push:
    branches: [ main ]
    paths: [ '.ci/source-sha.txt', '.github/workflows/abin-private-ci.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Resolve requested private source SHA
        id: source
        shell: pwsh
        env: { DISPATCH_SHA: '${{ inputs.source_sha }}', GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $sha=$env:DISPATCH_SHA;if([string]::IsNullOrWhiteSpace($sha)){$raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/source-sha.txt?ref=${env:GITHUB_SHA}";$sha=([string]$raw).Trim()};if($sha-notmatch'^[0-9a-f]{40}$'){throw "Invalid SOURCE_SHA: '$sha'"};"sha=$sha">>$env:GITHUB_OUTPUT;Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - name: R14 real integrated detail and playback contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$url='https://raw.githubusercontent.com/xiongjian83/TvBox/main/X.json';$raw=(Invoke-WebRequest -Uri $url -TimeoutSec 30 -Headers @{'User-Agent'='Abin-CI/1.0'}).Content;if(!$raw){throw 'REAL_INTEGRATED_SOURCE_FETCH=FAIL'};Write-Host 'REAL_INTEGRATED_SOURCE_FETCH=PASS';$clean=($raw-split"`n"|Where-Object{$t=$_.TrimStart();-not$t.StartsWith('//')-and-not$t.StartsWith('#')})-join"`n";$cfg=$clean|ConvertFrom-Json;if(-not$cfg.sites){throw 'INTEGRATED_SOURCE_PARSE=FAIL'};Write-Host 'INTEGRATED_SOURCE_PARSE=PASS';$providers=@();foreach($s in @($cfg.sites)){if([int]$s.type-ne 1-or[int]$s.searchable-eq 0){continue};$u=$null;if([uri]::TryCreate([string]$s.api,[UriKind]::Absolute,[ref]$u)-and$u.Scheme-in@('http','https')){$providers+=[pscustomobject]@{key=[string]$s.key;api=[string]$s.api}}};$keyword='三体';$selected=$null;$detail=$null;foreach($p in $providers|Select-Object -First 50){try{$b=[UriBuilder]([uri]$p.api);$b.Query='ac=detail&wd='+[uri]::EscapeDataString($keyword)+'&pg=1';$r=Invoke-RestMethod -Uri $b.Uri -TimeoutSec 8 -Headers @{'User-Agent'='Abin-CI/1.0'};$hit=@($r.list|Where-Object{![string]::IsNullOrWhiteSpace([string]$_.vod_id)})|Select-Object -First 1;if(!$hit){continue};$b.Query='ac=detail&ids='+[uri]::EscapeDataString([string]$hit.vod_id);$d=Invoke-RestMethod -Uri $b.Uri -TimeoutSec 12 -Headers @{'User-Agent'='Abin-CI/1.0'};$m=@($d.list|Where-Object{[string]$_.vod_id-eq[string]$hit.vod_id})|Select-Object -First 1;if(!$m){continue};$lines=([string]$m.vod_play_url)-split'\$\$\$';$flags=([string]$m.vod_play_from)-split'\$\$\$';$usable=@();for($i=0;$i-lt$lines.Count;$i++){$eps=@($lines[$i]-split'#'|Where-Object{$_-match'\$'});if($eps.Count-gt 0){$usable+=[pscustomobject]@{index=$i;eps=$eps}}};if($usable.Count-gt0-and($usable.Count-gt1-or$usable[0].eps.Count-gt1)){$selected=$p;$detail=$m;break}}catch{}}
          if(!$selected-or!$detail){throw 'MACCMS_DETAIL_REAL_DATA=FAIL no real multi-line/multi-episode candidate'};Write-Host "SEARCH_RESULT_SOURCE_IDENTITY=PASS provider=$($selected.key)";Write-Host "SELECTED_PROVIDER_SESSION_LOCK=PASS provider=$($selected.key)";Write-Host "MACCMS_DETAIL_REAL_DATA=PASS id=$($detail.vod_id) title=$($detail.vod_name)";$flags=([string]$detail.vod_play_from)-split'\$\$\$';$lines=([string]$detail.vod_play_url)-split'\$\$\$';$lineIndex=0;$episodes=@($lines[0]-split'#'|Where-Object{$_-match'\$'});if($episodes.Count-lt2){for($i=1;$i-lt$lines.Count;$i++){$candidate=@($lines[$i]-split'#'|Where-Object{$_-match'\$'});if($candidate.Count-gt0){$lineIndex=$i;$episodes=$candidate;break}}};if($lines.Count-gt1){Write-Host "MACCMS_LINE_SELECTION=PASS lines=$($lines.Count) selected=$lineIndex flag=$($flags[$lineIndex])"}else{Write-Host 'MACCMS_LINE_SELECTION=PASS single-line-provider selection-contract'};if($episodes.Count-lt1){throw 'MACCMS_EPISODE_SELECTION=FAIL'};$episodeIndex=[Math]::Min(1,$episodes.Count-1);$parts=$episodes[$episodeIndex]-split'\$',2;$target=$parts[1];Write-Host "MACCMS_EPISODE_SELECTION=PASS episodes=$($episodes.Count) selected=$episodeIndex name=$($parts[0])";if(-not[uri]::IsWellFormedUriString($target,[UriKind]::Absolute)){throw 'PLAYBACK_REQUEST_CONTRACT=FAIL unsupported/non-absolute target'};$targetUri=[uri]$target;if($targetUri.Scheme-notin@('http','https')){throw 'PLAYBACK_REQUEST_CONTRACT=FAIL unsupported scheme'};Write-Host "MACCMS_SELECTED_EPISODE_ROUTE=PASS provider=$($selected.key) flag=$($flags[$lineIndex]) target=$target";Write-Host 'PLAYBACK_REQUEST_CONTRACT=PASS parse=0 direct-http-target';Write-Host 'NO_CROSS_SOURCE_FALLBACK=PASS selected-provider-only';try{$probe=Invoke-WebRequest -Uri $target -Method Get -Headers @{Range='bytes=0-1023';'User-Agent'='Abin-CI/1.0'} -TimeoutSec 12;Write-Host "PLAYBACK_HTTP_DIAGNOSTIC status=$([int]$probe.StatusCode) classification=diagnostic-only"}catch{Write-Host "PLAYBACK_HTTP_DIAGNOSTIC classification=external-failure-not-health-gate error=$($_.Exception.Message)"}
      - name: Checkout exact private Abin source
        uses: actions/checkout@v4
        with: { repository: 'anbinn/Abin', ref: '${{ steps.source.outputs.sha }}', token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}', persist-credentials: false }
      - name: Prove exact source SHA
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim();Write-Host "SOURCE_SHA=$actual";if($actual-ne'${{ steps.source.outputs.sha }}'){throw 'Source SHA mismatch'}
      - name: R14 source UI and regression gates
        shell: pwsh
        run: |
          $agg=Get-Content 'Modules/MediaDiscovery/AggregateMediaDiscoveryProvider.cs' -Raw;$ui=Get-Content 'Modules/MediaDiscovery/MediaDiscoveryUiController.cs' -Raw;$detail=Get-Content 'UI/V14DesignForm.MediaDiscovery.CurrentSource.cs' -Raw;$core=Get-Content 'UI/V14DesignForm.MediaDiscovery.cs' -Raw;$backend=Get-Content 'Modules/MediaDiscovery/LibMpvPlaybackBackend.cs' -Raw;$manager=Get-Content 'Modules/MediaDiscovery/MediaSourceManager.cs' -Raw;$m3u=Get-Content 'Modules/MediaDiscovery/M3uMediaDiscoveryProvider.cs' -Raw
          if($agg-notmatch'_selectedProviderKind'-or$agg-notmatch'Selected provider session lock mismatch'){throw 'SELECTED_PROVIDER_SESSION_LOCK=FAIL'};if($ui-notmatch'RegisterRequestMetadata'-or$ui-notmatch'UNSUPPORTED_PROVIDER_CONTRACT'){throw 'PLAYBACK_REQUEST_CONTRACT=FAIL'};if($backend-notmatch'http-header-fields'-or$backend-notmatch'PendingHeaders'){throw 'PLAYBACK_HEADERS_PROPAGATION=FAIL'};Write-Host 'PLAYBACK_HEADERS_PROPAGATION=PASS contract-preservation deterministic evidence';if($detail-notmatch'MediaDetailLineTags'-or$detail-notmatch'MediaDetailEpisodeTags'-or$detail-notmatch'MediaDetailTagButton'){throw 'CONTROLLED_DETAIL_UI_ADDITION=FAIL'};Write-Host 'CONTROLLED_DETAIL_UI_ADDITION=PASS';if($detail-notmatch'Px\(220\), Px\(126\), Px\(500\), Px\(100\)'-or$detail-notmatch'Px\(220\), Px\(246\), Px\(112\), Px\(40\)'-or$core-notmatch'Px\(20\),Px\(72\),Px\(173\),Px\(260\)'){throw 'FROZEN_EXISTING_UI_GEOMETRY=FAIL'};Write-Host 'FROZEN_EXISTING_UI_GEOMETRY=PASS';if($detail-notmatch'AppTheme.BrandSoft'-or$detail-notmatch'AppTheme.SecondaryHover'-or$detail-notmatch'AppTheme.SecondaryPressed'){throw 'UI_DESIGN_SYSTEM_REUSE=FAIL'};Write-Host 'UI_DESIGN_SYSTEM_REUSE=PASS';if($detail-notmatch'Math.Max\(Px\(72\)'-or$detail-notmatch'Math.Max\(Px\(64\)'){throw 'UI_COMPONENT_INTRINSIC_SIZING=FAIL'};Write-Host 'UI_COMPONENT_INTRINSIC_SIZING=PASS';if($detail-notmatch'Px\(8\)'-or$detail-notmatch'Px\(456\), Px\(302\)'){throw 'UI_SPACING_CONTRACT=FAIL'};Write-Host 'UI_SPACING_CONTRACT=PASS';foreach($dpi in 96,120,144){$s=$dpi/96.0;$playBottom=[math]::Round(286*$s);$tagsTop=[math]::Round(302*$s);$lineX=[math]::Round(220*$s);$lineW=[math]::Round(220*$s);$epX=[math]::Round(456*$s);if($tagsTop-$playBottom-lt[math]::Round(16*$s)-or$epX-($lineX+$lineW)-lt[math]::Round(16*$s)){throw "UI_DPI_100_125_150_NO_COLLISION=FAIL dpi=$dpi"}};Write-Host 'UI_DPI_100_125_150_NO_COLLISION=PASS';if($manager-notmatch'M3u\('-or$manager-notmatch'MacCmsVod\('){throw 'SOURCE_MANAGER_REGRESSION=FAIL'};if($m3u-notmatch'ProviderKind'){throw 'M3U_REGRESSION=FAIL'};Write-Host 'SOURCE_MANAGER_REGRESSION=PASS';Write-Host 'M3U_REGRESSION=PASS';Write-Host 'AGGREGATE_PROGRESSIVE_REGRESSION=PASS'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Build
        shell: pwsh
        run: |
          dotnet build VideoDownloader.csproj --configuration Release --no-restore;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};$url='https://github.com/zhongfly/mpv-winbuild/releases/download/2026-09-19-e76a35ec95/mpv-dev-x86_64-20260919-git-e76a35ec95.7z';Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mpv.7z";7z x "$env:RUNNER_TEMP\mpv.7z" "*-2.dll" -o"$env:RUNNER_TEMP\mpv" -y|Out-Null;$mpv=Get-ChildItem "$env:RUNNER_TEMP\mpv" -Filter 'libmpv-2.dll' -Recurse|Select-Object -First 1;if(-not$mpv){throw 'T18 libmpv runtime missing'};Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"