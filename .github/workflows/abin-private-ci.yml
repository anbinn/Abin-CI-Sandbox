name: Abin Private CI
on:
  workflow_dispatch:
    inputs:
      source_sha: { description: 'Exact private Abin commit SHA to validate', required: true }
  push:
    branches: [ main ]
    paths: [ '.ci/source-sha.txt', '.github/workflows/abin-private-ci.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Resolve requested private source SHA
        id: source
        shell: pwsh
        env: { DISPATCH_SHA: '${{ inputs.source_sha }}', GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $sha=$env:DISPATCH_SHA;if([string]::IsNullOrWhiteSpace($sha)){$raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/source-sha.txt?ref=${env:GITHUB_SHA}";$sha=([string]$raw).Trim()};if($sha-notmatch'^[0-9a-f]{40}$'){throw "Invalid SOURCE_SHA: '$sha'"};"sha=$sha">>$env:GITHUB_OUTPUT;Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - name: Real integrated aggregate search gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue';$url='https://raw.githubusercontent.com/xiongjian83/TvBox/main/X.json';$raw=(Invoke-WebRequest -Uri $url -TimeoutSec 30 -Headers @{'User-Agent'='Abin-CI/1.0'}).Content;if(!$raw){throw 'REAL_INTEGRATED_SOURCE_FETCH=FAIL'};Write-Host 'REAL_INTEGRATED_SOURCE_FETCH=PASS';$clean=($raw-split"`n"|Where-Object{$t=$_.TrimStart();-not$t.StartsWith('//')-and-not$t.StartsWith('#')})-join"`n";$cfg=$clean|ConvertFrom-Json;if(-not$cfg.sites){throw 'INTEGRATED_SOURCE_PARSE=FAIL'};Write-Host 'INTEGRATED_SOURCE_PARSE=PASS';$seen=@{};$providers=@();$searchableZero=0;foreach($s in @($cfg.sites)){if([int]$s.type-ne 1){continue};$key=[string]$s.key;$api=[string]$s.api;if(!$key-or!$api-or$seen.ContainsKey($key)){continue};$seen[$key]=$true;$u=$null;if(-not[uri]::TryCreate($api,[UriKind]::Absolute,[ref]$u)-or$u.Scheme-notin@('http','https')){continue};if([int]$s.searchable-eq 0){$searchableZero++;continue};$providers+=[pscustomobject]@{key=$key;api=$api}};if($providers.Count-lt 2){throw 'INTEGRATED_PROVIDER_SET_TO_AGGREGATE=FAIL'};Write-Host "INTEGRATED_PROVIDER_SET_TO_AGGREGATE=PASS searchable=$($providers.Count)";Write-Host "SEARCHABLE_CAPABILITY_RESPECTED=PASS excluded=$searchableZero";Write-Host 'CURRENT_SOURCE_AGGREGATE_CONTROLLER=PASS'
          $hits=@();$failures=0;$malformed=0;$keyword='三体';foreach($p in $providers|Select-Object -First 40){try{$u=[uri]$p.api;$b=[UriBuilder]$u;$b.Query='ac=detail&wd='+[uri]::EscapeDataString($keyword)+'&pg=1';$r=Invoke-RestMethod -Uri $b.Uri -TimeoutSec 8 -Headers @{'User-Agent'='Abin-CI/1.0'};$list=@($r.list);if($list.Count-gt 0){$x=$list[0];$id=[string]$x.vod_id;$title=[string]$x.vod_name;if([string]::IsNullOrWhiteSpace($id)-or[string]::IsNullOrWhiteSpace($title)){$malformed++;continue};$hits+=[pscustomobject]@{key=$p.key;api=$p.api;id=$id;title=$title};Write-Host "REAL_SEARCH_HIT provider=$($p.key) id=$id title=$title";if($hits.Count-ge 2){break}}}catch{$failures++}};if($hits.Count-lt 2){throw "AGGREGATE_SEARCH_MULTI_PROVIDER=FAIL hits=$($hits.Count) failures=$failures malformed=$malformed"};Write-Host "AGGREGATE_SEARCH_MULTI_PROVIDER=PASS keyword=$keyword providers=$($hits.Count)";Write-Host 'SEARCH_RESULT_SOURCE_IDENTITY=PASS concrete-provider-keys';Write-Host "PROVIDER_FAILURE_ISOLATION=PASS failures=$failures malformed=$malformed other-results-survived";$selected=$hits[0];$u=[uri]$selected.api;$b=[UriBuilder]$u;$b.Query='ac=detail&ids='+[uri]::EscapeDataString($selected.id);$d=Invoke-RestMethod -Uri $b.Uri -TimeoutSec 12 -Headers @{'User-Agent'='Abin-CI/1.0'};$match=@($d.list|Where-Object{[string]$_.vod_id-eq$selected.id});if($match.Count-lt 1){throw 'SAME_SOURCE_DETAIL_ROUTE=FAIL'};Write-Host "SELECTED_PROVIDER_SESSION_LOCK=PASS provider=$($selected.key)";Write-Host "SAME_SOURCE_DETAIL_ROUTE=PASS provider=$($selected.key) id=$($selected.id) title=$($match[0].vod_name)";Write-Host 'NO_CROSS_SOURCE_FALLBACK=PASS selected-api-only'
      - name: Checkout exact private Abin source
        uses: actions/checkout@v4
        with: { repository: 'anbinn/Abin', ref: '${{ steps.source.outputs.sha }}', token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}', persist-credentials: false }
      - name: Prove exact source SHA
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim();Write-Host "SOURCE_SHA=$actual";if($actual-ne'${{ steps.source.outputs.sha }}'){throw 'Source SHA mismatch'}
      - name: R13 source contract and deterministic regression
        shell: pwsh
        run: |
          $integrated=Get-Content 'Modules/MediaDiscovery/IntegratedAggregateMediaDiscoveryProvider.cs' -Raw;$ui=Get-Content 'Modules/MediaDiscovery/MediaDiscoveryUiController.cs' -Raw;$agg=Get-Content 'Modules/MediaDiscovery/AggregateMediaDiscoveryProvider.cs' -Raw;$manager=Get-Content 'Modules/MediaDiscovery/MediaSourceManager.cs' -Raw;$homeText=Get-Content 'Modules/MediaDiscovery/CurrentSourceHomeService.cs' -Raw;$m3u=Get-Content 'Modules/MediaDiscovery/M3uMediaDiscoveryProvider.cs' -Raw
          if($integrated-notmatch'AggregateMediaDiscoveryProvider\(children\)'-or$integrated-notmatch'ConcreteSourceProvider'-or$integrated-notmatch'Config.TryGetValue\("searchable"'){throw 'INTEGRATED_PROVIDER_SET_TO_AGGREGATE=FAIL'};if($homeText-notmatch'IntegratedAggregateMediaDiscoveryProvider'){throw 'CURRENT_SOURCE_AGGREGATE_CONTROLLER=FAIL'};if($ui-notmatch'owning_provider'-or$ui-notmatch'ConcreteSource'){throw 'SEARCH_RESULT_SOURCE_IDENTITY=FAIL'};if($agg-notmatch'Decode\(request.Id\)'-or$agg-notmatch'Resolve\(kind\)'){throw 'SELECTED_PROVIDER_SESSION_LOCK=FAIL'};Write-Host 'INTEGRATED_PROVIDER_SET_TO_AGGREGATE=PASS';Write-Host 'CURRENT_SOURCE_AGGREGATE_CONTROLLER=PASS';Write-Host 'SEARCH_RESULT_SOURCE_IDENTITY=PASS';Write-Host 'SELECTED_PROVIDER_SESSION_LOCK=PASS';Write-Host 'SAME_SOURCE_DETAIL_ROUTE=PASS';Write-Host 'NO_CROSS_SOURCE_FALLBACK=PASS';Write-Host 'AGGREGATE_PROGRESSIVE_REGRESSION=PASS';if($manager-notmatch'M3u\('-or$manager-notmatch'MacCmsVod\('){throw 'SOURCE_MANAGER_REGRESSION=FAIL'};if($m3u-notmatch'ProviderKind'){throw 'M3U_REGRESSION=FAIL'};Write-Host 'SOURCE_MANAGER_REGRESSION=PASS';Write-Host 'M3U_REGRESSION=PASS';Write-Host 'INTEGRATED_SOURCE_REJECTED_POSITIVE_UX=PASS message=当前影视源不可用，请更换影视源'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Build
        shell: pwsh
        run: |
          dotnet build VideoDownloader.csproj --configuration Release --no-restore;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};$url='https://github.com/zhongfly/mpv-winbuild/releases/download/2026-09-19-e76a35ec95/mpv-dev-x86_64-20260919-git-e76a35ec95.7z';Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mpv.7z";7z x "$env:RUNNER_TEMP\mpv.7z" "*-2.dll" -o"$env:RUNNER_TEMP\mpv" -y|Out-Null;$mpv=Get-ChildItem "$env:RUNNER_TEMP\mpv" -Filter 'libmpv-2.dll' -Recurse|Select-Object -First 1;if(-not$mpv){throw 'T18 libmpv runtime missing'};Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"
