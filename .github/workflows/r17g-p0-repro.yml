name: R17G P0 Production Enter Repro
on:
  push:
    paths: ['.ci/r17g-sha.txt']
permissions:
  contents: read
jobs:
  repro:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - id: sha
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $raw=Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github.raw+json'} -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/contents/.ci/r17g-sha.txt?ref=${env:GITHUB_SHA}"
          $sha=([string]$raw).Trim(); "sha=$sha">>$env:GITHUB_OUTPUT; Write-Host "REQUESTED_SOURCE_SHA=$sha"
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: '${{ steps.sha.outputs.sha }}'
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Exact SHA and production Enter lifecycle probe
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); Write-Host "SOURCE_SHA=$actual"; if($actual-ne'${{ steps.sha.outputs.sha }}'){throw 'SHA mismatch'}
          @'
          using System.Reflection;
          using VideoDownloader.Modules.MediaDiscovery;
          namespace VideoDownloader.UI;
          public sealed partial class V14DesignForm
          {
            internal static string R17GRunProductionEnterProbe()
            {
              var done=new ManualResetEventSlim(false);var lines=new List<string>();Exception? observed=null;var unobserved=new List<string>();
              EventHandler<UnobservedTaskExceptionEventArgs> uh=(_,e)=>{lock(unobserved)unobserved.Add(e.Exception.ToString());e.SetObserved();};TaskScheduler.UnobservedTaskException+=uh;
              var thread=new Thread(()=>
              {
                Application.SetUnhandledExceptionMode(UnhandledExceptionMode.CatchException);
                ThreadExceptionEventHandler th=(_,e)=>{observed=e.Exception;lines.Add("THREAD_EXCEPTION="+e.Exception);done.Set();Application.ExitThread();};Application.ThreadException+=th;
                var form=new V14DesignForm();
                form.Shown+=async(_,_)=>
                {
                  try
                  {
                    if(!MediaDiscoveryUiController.TryCreateIntegrated("https://raw.githubusercontent.com/xiongjian83/TvBox/main/X.json",out var c,out var err)||c is null)throw new Exception(err??"controller create failed");
                    await c.InitializeAsync();form._mediaController=c;form._mediaRuntimeReady=true;form.WireMediaControllerEvents();
                    form._mediaKeyword.Text="三体";
                    var onKey=typeof(Control).GetMethod("OnKeyDown",BindingFlags.Instance|BindingFlags.NonPublic)!;
                    lines.Add("ENTER_DISPATCH=production V14TextBox KeyDown -> RunRealMediaSearchAsync");
                    onKey.Invoke(form._mediaKeyword,new object[]{new KeyEventArgs(Keys.Enter)});
                    await Task.Delay(80);
                    lines.Add($"POST_ENTER page={form._mediaCurrentPage.Kind} handle={form.IsHandleCreated} disposed={form.IsDisposed}");
                    form.Dispose();lines.Add("LIFECYCLE_BOUNDARY=form disposed after production Enter while progressive search outstanding");
                    await Task.Delay(12000);
                    GC.Collect();GC.WaitForPendingFinalizers();GC.Collect();await Task.Delay(500);
                    lock(unobserved)foreach(var x in unobserved)lines.Add("UNOBSERVED_TASK_EXCEPTION="+x);
                    done.Set();Application.ExitThread();
                  }catch(Exception ex){observed=ex;lines.Add("HARNESS_EXCEPTION="+ex);done.Set();Application.ExitThread();}
                };
                Application.Run(form);Application.ThreadException-=th;
              });thread.SetApartmentState(ApartmentState.STA);thread.Start();
              if(!done.Wait(TimeSpan.FromSeconds(30))){lines.Add("PROBE_TIMEOUT");}
              thread.Join(3000);TaskScheduler.UnobservedTaskException-=uh;
              lines.Add("OBSERVED_EXCEPTION="+(observed?.GetType().FullName??"none"));
              return string.Join(Environment.NewLine,lines);
            }
          }
          '@ | Set-Content 'UI/V14DesignForm.R17GCiProbe.cs' -Encoding utf8
          dotnet restore VideoDownloader.csproj; if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet build VideoDownloader.csproj -c Release --no-restore; if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $out=(Resolve-Path 'bin\Release\net10.0-windows').Path
          $asm=[Reflection.Assembly]::LoadFrom((Join-Path $out '阿斌视频下载器.dll'));$t=$asm.GetType('VideoDownloader.UI.V14DesignForm',$true);$m=$t.GetMethod('R17GRunProductionEnterProbe',[Reflection.BindingFlags]'Static,NonPublic');$result=$m.Invoke($null,@());Write-Host $result
          $mpv=Get-ChildItem $out -Filter 'libmpv-2.dll'|Select-Object -First 1;if(-not$mpv){throw 'T18_LIBMPV_RUNTIME=FAIL'};Write-Host "T18_LIBMPV_RUNTIME=READY:$($mpv.FullName)"
          Write-Host 'R17G_PRODUCTION_ENTER_PROBE=EXECUTED'
