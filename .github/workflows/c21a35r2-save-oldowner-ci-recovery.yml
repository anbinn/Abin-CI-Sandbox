name: C21A35R2 Save Old-owner CI Recovery
on: { push: { branches: [ main ], paths: [ '.github/workflows/c21a35r2-save-oldowner-ci-recovery.yml' ] } }
permissions: { contents: read }
jobs:
 validate:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
     with: { repository: anbinn/Abin, ref: 4a74190b9e9caa7d843d58c47ba8b9cf7870ab99, token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}', persist-credentials: false, fetch-depth: 2 }
   - name: Prove Save ownership
     shell: pwsh
     run: |
      $s='4a74190b9e9caa7d843d58c47ba8b9cf7870ab99';$p='b87f85e418c806b735a11bd931b10b5dc161645b';if((git rev-parse HEAD).Trim()-ne$s-or(git rev-parse HEAD^).Trim()-ne$p){throw 'IDENTITY'}
      $f=@(git diff --name-only $p HEAD);if($f.Count-ne 1-or$f[0]-ne'UI/V14DesignForm.Actions.cs'){throw 'SCOPE'}
      $num=(git diff --numstat $p HEAD -- UI/V14DesignForm.Actions.cs).Trim();if($num-ne("0"+[char]9+"6"+[char]9+"UI/V14DesignForm.Actions.cs")){throw "SHAPE=$num"}
      $a=Get-Content UI/V14DesignForm.Actions.cs -Raw;if($a.Contains('SetCardTitle(_saveCard')-or$a.Contains('Controls["CardTitle"]')){throw 'OLD_OWNER'};foreach($t in @('_saveCard.ApplyLanguage(IsEnglish)','_saveCard.SetPath(_downloadFolder)','_videoDownloadTaskRunner.RunAsync','_downloadCts')){if(-not$a.Contains($t)){throw "FREEZE=$t"}}
      $o=Get-Content Modules/VideoDownload/UI/VideoDownloadSaveComposite.cs -Raw;foreach($t in @('BrowseRequested','SetPath','SetDownloading','ApplyLanguage','if(Controls["CardTitle"] is Label title)','title.Text=isEnglish?"Save Location":"保存位置"')){if(-not$o.Contains($t)){throw "SAVE_OWNER=$t"}}
      $shell=(@('UI/V14DesignForm.cs','UI/V14DesignForm.Actions.cs','UI/V14DesignForm.CompactLayout.cs','UI/V14DesignForm.Progress.cs','UI/V14DesignForm.LiveStats.cs')|%{Get-Content $_ -Raw})-join "\n";if($shell -match '_saveCard\\.Controls\\s*\\['){throw 'SAVE_CHILD_LOOKUP'}
      Write-Host 'SOURCE_IDENTITY=PASS';Write-Host 'SOURCE_SHAPE=PASS';Write-Host 'OLD_OWNER_EXIT=PASS';Write-Host 'LANGUAGE_FREEZE=PASS';Write-Host 'INTERACTION_FREEZE=PASS';Write-Host 'BUSINESS_FREEZE=PASS';Write-Host 'VISUAL_FREEZE=PASS';Write-Host 'PRIOR_OWNER_FREEZE=PASS'
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: '10.0.x' }
   - run: dotnet restore VideoDownloader.csproj
   - name: Release build clean
     shell: pwsh
     run: |
      $o=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1;$o|%{Write-Host $_};if($LASTEXITCODE-ne 0){throw 'BUILD'};if(($o-join "`n")-notmatch '0 Warning\(s\)'-or($o-join "`n")-notmatch '0 Error\(s\)'){throw 'CLEAN'};Write-Host 'BUILD_CLEAN=PASS'
