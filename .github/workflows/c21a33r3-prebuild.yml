name: C21A33R3 Precommit Build
on: { push: { branches: [ main ], paths: [ '.github/workflows/c21a33r3-prebuild.yml' ] } }
permissions: { contents: read }
jobs:
 build:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
     with: { repository: anbinn/Abin, ref: d7516acea1646fb985586d6e1ce115dc11507c08, token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}', persist-credentials: false, fetch-depth: 2 }
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: '10.0.x' }
   - run: dotnet restore VideoDownloader.csproj
   - run: dotnet build VideoDownloader.csproj --configuration Release --no-restore
