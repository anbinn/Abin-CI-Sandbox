name: C21A42 R1 Popup Elevation
on:
  push:
    branches: [ v16-t90-r1-validation ]
    paths: [ '.github/workflows/c21a42-r1.yml' ]
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 4a64e56757c615449a58aae26b61216b5c416701
          token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
      - name: Prove R1 exact scope
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne '4a64e56757c615449a58aae26b61216b5c416701'){throw 'SHA'}
          [string[]]$changed=@(git diff --name-only 3f96837edcdf6d401efb4ff602a326995a5420cf HEAD)
          Write-Host "Changed: $($changed -join ', ')"
          if($changed.Count-ne 1){throw 'R1 must be one shared-control file'}
          if(($changed[0].Trim())-ne 'UI/Controls/V14ComboBox.cs'){throw 'R1 scope escaped shared combo'}
          Write-Host 'R1_SCOPE_SHARED_COMBO_ONLY=PASS'
          Write-Host 'Visual acceptance intentionally deferred to PM/Windows focused recheck.'
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore
        run: dotnet restore VideoDownloader.csproj
      - name: Release build clean
        shell: pwsh
        run: |
          $o=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1
          $o|%{Write-Host $_}
          if($LASTEXITCODE-ne 0){throw 'BUILD'}
          $s=$o-join "`n"
          if($s-notmatch '0 Warning\(s\)' -or $s-notmatch '0 Error\(s\)'){throw 'CLEAN'}
