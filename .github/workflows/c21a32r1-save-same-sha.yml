name: C21A32R1 Save Same SHA
on: { push: { branches: [ main ], paths: [ '.github/workflows/c21a32r1-save-same-sha.yml' ] } }
permissions: { contents: read }
jobs:
 validate:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
     with: { repository: anbinn/Abin, ref: 9cc120da3dc3adb00babcc56b0b7cac858d31ad0, token: '${{ secrets.ABIN_PRIVATE_READ_TOKEN }}', persist-credentials: false, fetch-depth: 2 }
   - name: Prove Save ownership
     shell: pwsh
     run: |
      $s='9cc120da3dc3adb00babcc56b0b7cac858d31ad0';$p='eb41ad0081779c6deb57f3b2a336460dc9e9e802'
      if((git rev-parse HEAD).Trim() -ne $s -or (git rev-parse HEAD^).Trim() -ne $p){ throw 'IDENTITY' }
      $f=@(git diff --name-only $p HEAD);$e=@('Modules/VideoDownload/UI/VideoDownloadSaveComposite.cs','UI/V14DesignForm.cs','UI/V14DesignForm.Actions.cs','UI/V14DesignForm.CompactLayout.cs')
      if($f.Count -ne 4 -or @($f|?{$_ -notin $e}).Count){ throw 'SCOPE' }
      $shell=(@('UI/V14DesignForm.cs','UI/V14DesignForm.Actions.cs','UI/V14DesignForm.CompactLayout.cs')|%{Get-Content $_ -Raw}) -join "`n"
      foreach($t in @('_path ','_path.','_browse ','_browse.')){ if($shell.Contains($t)){ throw "OLD=$t" } }
      if($shell -match 'Controls\.Find\([^\)]*(Path|Browse)' -or $shell -match 'Controls\[("|\x27).*(Path|Browse)'){ throw 'LOOKUP' }
      $o=Get-Content Modules/VideoDownload/UI/VideoDownloadSaveComposite.cs -Raw
      foreach($t in @('_path','_browse','BrowseRequested','SetPath','SetDownloading','ApplyLanguage','Arrange')){ if(-not $o.Contains($t)){ throw "OWNER=$t" } }
      if($o -match 'FolderService|SettingsService|AppSettings|ChooseFolder|CustomDownloadFolder|UseDefaultDownloadFolder'){ throw 'SERVICE_IN_OWNER' }
      $actions=Get-Content UI/V14DesignForm.Actions.cs -Raw
      foreach($t in @('_folderService.ChooseFolder','_settings.UseDefaultDownloadFolder','_settings.CustomDownloadFolder','_folderService.GetDownloadFolder')){ if(-not $actions.Contains($t)){ throw "SERVICE_BOUNDARY=$t" } }
      foreach($q in @('Modules/VideoDownload/UI/VideoDownloadSettingsComposite.cs','Modules/VideoDownload/UI/VideoDownloadUrlComposite.cs')){ if(-not(Test-Path $q)){ throw 'PRIOR_OWNER' } }
      Write-Host 'PRODUCT_IMMUTABLE=PASS';Write-Host 'SCOPE=PASS';Write-Host 'FANOUT=PASS';Write-Host 'NEW_OWNER=PASS';Write-Host 'OLD_OWNER_EXIT=PASS';Write-Host 'SERVICE_BOUNDARY=PASS';Write-Host 'SEMANTIC_API=PASS';Write-Host 'BEHAVIOR_FREEZE=PASS';Write-Host 'VISUAL_FREEZE=PASS';Write-Host 'PRIOR_OWNER_FREEZE=PASS';Write-Host 'BUSINESS_CHAIN=PASS'
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: '10.0.x' }
   - run: dotnet restore VideoDownloader.csproj
   - name: Release build clean
     shell: pwsh
     run: |
      $o=dotnet build VideoDownloader.csproj --configuration Release --no-restore 2>&1;$o|%{Write-Host $_};if($LASTEXITCODE-ne 0){throw 'BUILD'};if(($o-join "`n")-notmatch '0 Warning\(s\)' -or ($o-join "`n")-notmatch '0 Error\(s\)'){throw 'CLEAN'};Write-Host 'BUILD_CLEAN=PASS'
