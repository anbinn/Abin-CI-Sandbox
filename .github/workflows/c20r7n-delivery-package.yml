name: C20R7N Win10 delivery package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/c20r7n-delivery-package.yml'
      - 'tools/c20r7n-norton-discriminator.ps1'
      - 'tools/c20r7n-two-run-controller.ps1'
      - 'tools/c20r7n-run-on-win10.cmd'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout product
        uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 474471262da118842db022cf2711b613da681dd0
          token: ${{ secrets.ABIN_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: anbinn/Abin-CI-Sandbox
          ref: main
          path: harness
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location product
          if ((git rev-parse HEAD).Trim() -ne '474471262da118842db022cf2711b613da681dd0') { throw 'SOURCE_SHA_MISMATCH' }
          if ((dotnet --version).Trim() -ne '10.0.401') { throw 'SDK_MISMATCH' }
          $runtime = dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.NETCore\.App 10\.0\.12 \[' } | Select-Object -First 1
          if (-not $runtime) { throw 'RUNTIME_MISMATCH' }
          dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\candidate"
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISH_FAILED' }
          $stem = -join ([int[]](0x963F,0x658C,0x89C6,0x9891,0x4E0B,0x8F7D,0x5668) | ForEach-Object { [char]$_ })
          $built = Join-Path "$env:RUNNER_TEMP\candidate" ($stem + '.exe')
          $expected = '18599C12A9A00E75F13A58F48E355F6F6FF20DBAEE049D8E856373AF5006A358'
          if ((Get-FileHash $built -Algorithm SHA256).Hash -ne $expected) { throw 'CANDIDATE_A_HASH_MISMATCH' }
          if ((Get-Item $built).Length -ne 279552) { throw 'CANDIDATE_A_SIZE_MISMATCH' }
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'C20R7N-Win10-Norton-Discriminator'
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item "$env:RUNNER_TEMP\candidate\*" $pkg -Recurse
          Rename-Item -LiteralPath (Join-Path $pkg ($stem + '.exe')) -NewName 'Abin.exe'
          Copy-Item "$env:GITHUB_WORKSPACE\harness\tools\c20r7n-norton-discriminator.ps1" $pkg
          Copy-Item "$env:GITHUB_WORKSPACE\harness\tools\c20r7n-two-run-controller.ps1" $pkg
          Copy-Item "$env:GITHUB_WORKSPACE\harness\tools\c20r7n-run-on-win10.cmd" $pkg
          $h = (Get-FileHash (Join-Path $pkg 'Abin.exe') -Algorithm SHA256).Hash
          if ($h -ne $expected) { throw 'PACKAGED_HASH_MISMATCH' }
          @("CandidateA_SHA256=$h","CandidateA_Size=279552","Source_SHA=474471262da118842db022cf2711b613da681dd0","SDK=10.0.401","Runtime=10.0.12") | Set-Content (Join-Path $pkg 'IDENTITY.txt') -Encoding ascii
          @('C20R7N Norton discriminator','Safety: package never disables Norton or changes exclusions automatically.','Run 1: double-click c20r7n-run-on-win10.cmd.','If CONFIRMATION_REQUIRED.txt appears, stop. PM/user explicit approval is required before a minimal reversible Norton exception change for Abin.exe only.','After approved manual state change, double-click the same CMD once for Run 2.','After Run 2 restore the original Norton state.') | Set-Content (Join-Path $pkg 'README.txt') -Encoding utf8
          Compress-Archive -Path "$pkg\*" -DestinationPath "$env:GITHUB_WORKSPACE\C20R7N-Win10-Norton-Discriminator.zip" -Force
      - name: Real discriminator regression on packaged Candidate A
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'C20R7N-Win10-Norton-Discriminator'
          $result = Join-Path $env:RUNNER_TEMP 'real-discriminator-result.json'
          $missingNortonLog = Join-Path $env:RUNNER_TEMP 'definitely-missing-norton-autosandbox.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $pkg 'c20r7n-norton-discriminator.ps1') -ExePath (Join-Path $pkg 'Abin.exe') -ExpectedSha256 '18599C12A9A00E75F13A58F48E355F6F6FF20DBAEE049D8E856373AF5006A358' -NortonLogPath $missingNortonLog -ResultPath $result -ObserveSeconds 2
          if ($LASTEXITCODE -ne 0) { throw "REAL_DISCRIMINATOR_FAILED_$LASTEXITCODE" }
          if (!(Test-Path $result)) { throw 'REAL_DISCRIMINATOR_RESULT_MISSING' }
          $r = Get-Content $result -Raw | ConvertFrom-Json
          if ($r.exe_sha256 -ne '18599C12A9A00E75F13A58F48E355F6F6FF20DBAEE049D8E856373AF5006A358') { throw 'REAL_DISCRIMINATOR_IDENTITY_MISMATCH' }
          if ($null -eq $r.max_exact_path_count) { throw 'REAL_DISCRIMINATOR_MAX_COUNT_MISSING' }
          if ($null -eq $r.window_seen) { throw 'REAL_DISCRIMINATOR_WINDOW_FIELD_MISSING' }
          if ($null -eq $r.observations -or @($r.observations).Count -ne 2) { throw 'REAL_DISCRIMINATOR_OBSERVATIONS_INVALID' }
          foreach ($o in @($r.observations)) {
            if ($null -eq $o.exact_path_count) { throw 'REAL_DISCRIMINATOR_EXACT_PATH_COUNT_MISSING' }
            if ($null -eq $o.processes) { throw 'REAL_DISCRIMINATOR_PROCESSES_MISSING' }
          }
          Write-Host "REAL_DISCRIMINATOR_PASS max_exact_path_count=$($r.max_exact_path_count) window_seen=$($r.window_seen) observations=$(@($r.observations).Count)"
      - name: Offline self-test through exact CMD launcher
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip = "$env:GITHUB_WORKSPACE\C20R7N-Win10-Norton-Discriminator.zip"
          $d = "$env:RUNNER_TEMP\verify"
          Expand-Archive $zip $d -Force
          if ((Get-FileHash (Join-Path $d 'Abin.exe') -Algorithm SHA256).Hash -ne '18599C12A9A00E75F13A58F48E355F6F6FF20DBAEE049D8E856373AF5006A358') { throw 'ZIP_IDENTITY_MISMATCH' }
          foreach ($f in @('c20r7n-norton-discriminator.ps1','c20r7n-two-run-controller.ps1','c20r7n-run-on-win10.cmd','IDENTITY.txt','README.txt')) { if (!(Test-Path (Join-Path $d $f))) { throw "MISSING_$f" } }
          Push-Location "$env:WINDIR\System32"
          try { & (Join-Path $d 'c20r7n-run-on-win10.cmd') --self-test } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "CMD_LAUNCHER_SELFTEST_FAILED_$LASTEXITCODE" }
          if (!(Test-Path (Join-Path $d 'c20r7n-summary.json'))) { throw 'CMD_LAUNCHER_SUMMARY_MISSING' }
          if (Test-Path (Join-Path $d 'c20r7n-error.txt')) { throw 'CMD_LAUNCHER_ERROR_FILE_PRESENT' }
      - name: User-path regression matrix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip = "$env:GITHUB_WORKSPACE\C20R7N-Win10-Norton-Discriminator.zip"
          $cases = @(
            (Join-Path $env:USERPROFILE 'OneDrive\Desktop\C20R7N-Win10-Norton-Discriminator\C20R7N-Win10-Norton-Discriminator'),
            (Join-Path $env:USERPROFILE 'OneDrive\Desktop\C20R7N Test Space\C20R7N-Win10-Norton-Discriminator')
          )
          foreach ($d in $cases) {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force }
            New-Item -ItemType Directory -Path $d -Force | Out-Null
            Expand-Archive $zip $d -Force
            Push-Location "$env:WINDIR\System32"
            try { & (Join-Path $d 'c20r7n-run-on-win10.cmd') --self-test } finally { Pop-Location }
            if ($LASTEXITCODE -ne 0) { throw "USER_PATH_CMD_FAILED_$LASTEXITCODE::$d" }
            if (!(Test-Path (Join-Path $d 'c20r7n-summary.json'))) { throw "USER_PATH_SUMMARY_MISSING::$d" }
            if (!(Test-Path (Join-Path $d 'c20r7n-console.log'))) { throw "USER_PATH_CONSOLE_LOG_MISSING::$d" }
            if (Test-Path (Join-Path $d 'c20r7n-error.txt')) { throw "USER_PATH_UNEXPECTED_ERROR_FILE::$d" }
          }
      - name: Failure persistence regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip = "$env:GITHUB_WORKSPACE\C20R7N-Win10-Norton-Discriminator.zip"
          $d = Join-Path $env:USERPROFILE 'OneDrive\Desktop\C20R7N-Failure-Persistence\C20R7N-Win10-Norton-Discriminator'
          if (Test-Path $d) { Remove-Item $d -Recurse -Force }
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          Expand-Archive $zip $d -Force
          Add-Content -LiteralPath (Join-Path $d 'Abin.exe') -Value 'X' -NoNewline
          $cmd = Join-Path $d 'c20r7n-run-on-win10.cmd'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = 'cmd.exe'
          $psi.Arguments = "/d /c call `"$cmd`" --self-test"
          $psi.WorkingDirectory = "$env:WINDIR\System32"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $psi
          [void]$p.Start()
          $p.StandardInput.WriteLine('x')
          $p.StandardInput.Close()
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          $p.WaitForExit()
          if ($p.ExitCode -eq 0) { throw 'FAILURE_PERSISTENCE_EXPECTED_NONZERO' }
          if (!(Test-Path (Join-Path $d 'c20r7n-error.txt'))) { throw "FAILURE_ERROR_FILE_MISSING`n$stdout`n$stderr" }
          if (!(Test-Path (Join-Path $d 'c20r7n-console.log'))) { throw 'FAILURE_CONSOLE_LOG_MISSING' }
          $err = Get-Content (Join-Path $d 'c20r7n-error.txt') -Raw
          if ($err -notmatch 'CANDIDATE_A_IDENTITY_FAILED') { throw "FAILURE_ERROR_CONTENT_WRONG::$err" }
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: C20R7N-Win10-Norton-Discriminator
          path: C20R7N-Win10-Norton-Discriminator.zip
          if-no-files-found: error
