name: C20 Candidate Reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 474471262da118842db022cf2711b613da681dd0
          token: ${{ secrets.ABIN_PRIVATE_READ_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Strict normalizer A/B isolation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $baseline='474471262da118842db022cf2711b613da681dd0'
          if((git rev-parse HEAD).Trim() -ne $baseline){throw 'BASELINE_MISMATCH'}
          $sdk=(dotnet --version).Trim(); if($sdk -ne '10.0.401'){throw "SDK=$sdk"}
          dotnet --info
          $sdkRoot=(dotnet --list-sdks | Where-Object {$_ -match '^10\.0\.401 '}) -replace '^10\.0\.401 \[','' -replace '\]$',''
          $hostModel=Join-Path $sdkRoot '10.0.401\Microsoft.NET.HostModel.dll'
          $sdkAppHost=Join-Path $sdkRoot '10.0.401\AppHostTemplate\apphost.exe'
          $pack=Join-Path (Split-Path $sdkRoot -Parent) 'packs\Microsoft.NETCore.App.Host.win-x64\10.0.12\runtimes\win-x64\native\apphost.exe'
          Write-Host "HOSTMODEL_SHA=$((Get-FileHash $hostModel -Algorithm SHA256).Hash)|SIZE=$((Get-Item $hostModel).Length)"
          Write-Host "SDK_APPHOST_SHA=$((Get-FileHash $sdkAppHost -Algorithm SHA256).Hash)|SIZE=$((Get-Item $sdkAppHost).Length)"
          Write-Host "PACK_APPHOST_SHA=$((Get-FileHash $pack -Algorithm SHA256).Hash)|SIZE=$((Get-Item $pack).Length)"
          if((Get-FileHash $sdkAppHost).Hash -ne '0649F1BEBACEF4F17B6694201ABC6DDE152C333468D2314B4F7104D34D70C7AA'){throw 'APPHOST_INPUT_HASH_MISMATCH'}

          $productStem = -join ([int[]](0x963F,0x658C,0x89C6,0x9891,0x4E0B,0x8F7D,0x5668) | ForEach-Object {[char]$_})
          $exeName=$productStem+'.exe'; $dllName=$productStem+'.dll'
          $proj=Join-Path $PWD 'VideoDownloader.csproj'
          $projBefore=(Get-FileHash $proj -Algorithm SHA256).Hash

          Write-Host 'A_PUBLISH=dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false'
          dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\A"
          if((Get-FileHash $proj -Algorithm SHA256).Hash -ne $projBefore){throw 'A_MUTATED_PROJECT'}

          $xml=[IO.File]::ReadAllText($proj)
          $preparePattern='(?s)\s*<Target Name="PrepareAppHostVersionResourceNormalizer".*?</Target>'
          $normalizePattern='(?s)\s*<Target Name="NormalizeWindowsAppHostVersionResource".*?</Target>'
          if(([regex]::Matches($xml,$preparePattern)).Count -ne 1){throw 'PREPARE_TARGET_MATCH_COUNT'}
          if(([regex]::Matches($xml,$normalizePattern)).Count -ne 1){throw 'NORMALIZE_TARGET_MATCH_COUNT'}
          $bxml=[regex]::Replace($xml,$preparePattern,'',1)
          $bxml=[regex]::Replace($bxml,$normalizePattern,'',1)
          $bproj=Join-Path $env:RUNNER_TEMP 'VideoDownloader.B.csproj'
          [IO.File]::WriteAllText($bproj,$bxml,(New-Object Text.UTF8Encoding($false)))
          if((Select-String -LiteralPath $bproj -Pattern 'PrepareAppHostVersionResourceNormalizer|NormalizeWindowsAppHostVersionResource' -Quiet)){throw 'B_NORMALIZER_TARGET_PRESENT'}
          Write-Host 'B_BYPASS_PROOF=PREPARE_TARGET_ABSENT;NORMALIZE_TARGET_ABSENT'
          Write-Host 'B_PUBLISH=dotnet publish <temp exact-baseline project minus only two normalizer targets> -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false'
          dotnet publish $bproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\B"
          if((Get-FileHash $proj -Algorithm SHA256).Hash -ne $projBefore){throw 'B_MUTATED_BASELINE_PROJECT'}
          if((git status --porcelain).Count -ne 0){throw 'WORKTREE_MUTATED'}

          function Fingerprint([string]$label,[string]$dir){
            $exe=Join-Path $dir $exeName; $dll=Join-Path $dir $dllName
            if(!(Test-Path -LiteralPath $exe) -or !(Test-Path -LiteralPath $dll)){throw "$label PRODUCT_FILES_NOT_FOUND"}
            $b=[IO.File]::ReadAllBytes($exe); $pe=[BitConverter]::ToInt32($b,0x3c); $n=[BitConverter]::ToUInt16($b,$pe+6); $opt=[BitConverter]::ToUInt16($b,$pe+20); $sec=$pe+24+$opt
            Write-Host "$label|EXE_SHA=$((Get-FileHash $exe -Algorithm SHA256).Hash)|SIZE=$($b.Length)|SECTIONS=$n"
            for($i=0;$i -lt $n;$i++){ $o=$sec+40*$i; $name=([Text.Encoding]::ASCII.GetString($b,$o,8)).Trim([char]0); $rs=[BitConverter]::ToUInt32($b,$o+16); $rp=[BitConverter]::ToUInt32($b,$o+20); Write-Host "$label|SECTION=$name|RAWSIZE=$rs|RAWPTR=$rp" }
            $needle=[Text.Encoding]::UTF8.GetBytes($dllName); $found=-1; for($i=0;$i -le $b.Length-$needle.Length;$i++){ $ok=$true; for($j=0;$j -lt $needle.Length;$j++){if($b[$i+$j] -ne $needle[$j]){$ok=$false;break}}; if($ok){$found=$i;break} }; Write-Host "$label|DLL_OFFSET=$found"
            $vi=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe); Write-Host "$label|EXE_FILEVERSION=$($vi.FileVersion)|EXE_PRODUCTVERSION=$($vi.ProductVersion)"
            $dvi=[Diagnostics.FileVersionInfo]::GetVersionInfo($dll); Write-Host "$label|DLL_SHA=$((Get-FileHash $dll -Algorithm SHA256).Hash)|DLL_PRODUCTVERSION=$($dvi.ProductVersion)"
            Get-ChildItem -LiteralPath $dir | Where-Object {$_.Name -like '*.deps.json' -or $_.Name -like '*.runtimeconfig.json'} | ForEach-Object { Write-Host "$label|CORE=$($_.Name)|SHA=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
            foreach($f in @('hostfxr.dll','hostpolicy.dll','coreclr.dll','clrjit.dll')){ $p=Join-Path $dir $f; if(!(Test-Path $p)){throw "$label MISSING_$f"}; Write-Host "$label|CORE=$f|SHA=$((Get-FileHash $p -Algorithm SHA256).Hash)" }
          }
          Fingerprint 'A' "$env:RUNNER_TEMP\A"
          Fingerprint 'B' "$env:RUNNER_TEMP\B"

          $coreNames=@($dllName,$productStem+'.deps.json',$productStem+'.runtimeconfig.json','hostfxr.dll','hostpolicy.dll','coreclr.dll','clrjit.dll')
          foreach($name in $coreNames){
            $ap=Join-Path "$env:RUNNER_TEMP\A" $name; $bp=Join-Path "$env:RUNNER_TEMP\B" $name
            if(!(Test-Path -LiteralPath $ap) -or !(Test-Path -LiteralPath $bp)){throw "INVARIANT_FILE_MISSING=$name"}
            $ah=(Get-FileHash $ap -Algorithm SHA256).Hash; $bh=(Get-FileHash $bp -Algorithm SHA256).Hash
            Write-Host "INVARIANT|$name|A=$ah|B=$bh|MATCH=$($ah -eq $bh)"
            if($ah -ne $bh){throw "NON_NORMALIZER_IDENTITY_CHANGED=$name"}
          }

          function LaunchBounded([string]$label,[string]$dir){
            $exe=Join-Path $dir $exeName
            Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.Path -eq $exe} | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 300
            $sw=[Diagnostics.Stopwatch]::StartNew(); $p=Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru; $sw.Stop()
            Write-Host "$label|LAUNCH_RETURNED=True|PID=$($p.Id)|ELAPSED_MS=$($sw.ElapsedMilliseconds)"
            $deadline=[DateTime]::UtcNow.AddSeconds(8); $hwnd=0
            do { Start-Sleep -Milliseconds 250; try{$p.Refresh();$hwnd=$p.MainWindowHandle}catch{} } while([DateTime]::UtcNow -lt $deadline -and !$p.HasExited -and $hwnd -eq 0)
            $same=@(Get-CimInstance Win32_Process | Where-Object {$_.ExecutablePath -eq $exe})
            Write-Host "$label|ALIVE=$(!$p.HasExited)|HWND=$hwnd|EXACT_PATH_COUNT=$($same.Count)|DUPLICATE=$($same.Count -gt 1)"
            foreach($q in $same){ Write-Host "$label|PROC_PID=$($q.ProcessId)|PPID=$($q.ParentProcessId)|PATH=$($q.ExecutablePath)" }
            foreach($q in $same){ Stop-Process -Id $q.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          LaunchBounded 'A' "$env:RUNNER_TEMP\A"
          LaunchBounded 'B' "$env:RUNNER_TEMP\B"
