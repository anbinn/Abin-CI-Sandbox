name: C20 Candidate Reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 474471262da118842db022cf2711b613da681dd0
          token: ${{ secrets.ABIN_PRIVATE_READ_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Strict normalizer A/B isolation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $baseline='474471262da118842db022cf2711b613da681dd0'; if((git rev-parse HEAD).Trim()-ne$baseline){throw 'BASELINE_MISMATCH'}
          if((dotnet --version).Trim()-ne'10.0.401'){throw 'SDK_MISMATCH'}; dotnet --info
          $sdkRoot=(dotnet --list-sdks|?{$_ -match '^10\.0\.401 '})-replace '^10\.0\.401 \[',''-replace '\]$','';$hostModel=Join-Path $sdkRoot '10.0.401\Microsoft.NET.HostModel.dll';$sdkAppHost=Join-Path $sdkRoot '10.0.401\AppHostTemplate\apphost.exe';$pack=Join-Path (Split-Path $sdkRoot -Parent) 'packs\Microsoft.NETCore.App.Host.win-x64\10.0.12\runtimes\win-x64\native\apphost.exe'
          Write-Host "HOSTMODEL_SHA=$((Get-FileHash $hostModel).Hash)|SIZE=$((Get-Item $hostModel).Length)";Write-Host "SDK_APPHOST_SHA=$((Get-FileHash $sdkAppHost).Hash)|SIZE=$((Get-Item $sdkAppHost).Length)";Write-Host "PACK_APPHOST_SHA=$((Get-FileHash $pack).Hash)|SIZE=$((Get-Item $pack).Length)";if((Get-FileHash $sdkAppHost).Hash-ne'0649F1BEBACEF4F17B6694201ABC6DDE152C333468D2314B4F7104D34D70C7AA'){throw 'APPHOST_INPUT_HASH_MISMATCH'}
          $stem=-join([int[]](0x963F,0x658C,0x89C6,0x9891,0x4E0B,0x8F7D,0x5668)|%{[char]$_});$exeName=$stem+'.exe';$dllName=$stem+'.dll';$depsName=$stem+'.deps.json';$runtimeConfigName=$stem+'.runtimeconfig.json';$proj=Join-Path $PWD 'VideoDownloader.csproj';$original=[IO.File]::ReadAllBytes($proj);$originalHash=(Get-FileHash $proj).Hash
          Write-Host 'A_PUBLISH=BASELINE_PROJECT';dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\A";if((Get-FileHash $proj).Hash-ne$originalHash){throw 'A_MUTATED_PROJECT'}
          $xml=[Text.Encoding]::UTF8.GetString($original);$p1='(?s)\s*<Target Name="PrepareAppHostVersionResourceNormalizer".*?</Target>';$p2='(?s)\s*<Target Name="NormalizeWindowsAppHostVersionResource".*?</Target>';if(([regex]::Matches($xml,$p1)).Count-ne1-or([regex]::Matches($xml,$p2)).Count-ne1){throw 'NORMALIZER_TARGET_MATCH_COUNT'};$bxml=[regex]::Replace([regex]::Replace($xml,$p1,'',1),$p2,'',1)
          try{[IO.File]::WriteAllText($proj,$bxml,(New-Object Text.UTF8Encoding($false)));if((Select-String $proj -Pattern 'PrepareAppHostVersionResourceNormalizer|NormalizeWindowsAppHostVersionResource' -Quiet)){throw 'B_TARGET_PRESENT'};Write-Host 'B_BYPASS_PROOF=ORIGINAL_PROJECT_PATH_AND_NAME;ONLY_TWO_NORMALIZER_TARGETS_REMOVED';git diff -- VideoDownloader.csproj|Write-Host;dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\B"}finally{[IO.File]::WriteAllBytes($proj,$original)}
          if((Get-FileHash $proj).Hash-ne$originalHash-or(git status --porcelain).Count-ne0){throw 'BASELINE_RESTORE_FAILED'}
          function FP($l,$d){$e=Join-Path $d $exeName;$dll=Join-Path $d $dllName;if(!(Test-Path $e)-or!(Test-Path $dll)){throw "$l PRODUCT_FILES_NOT_FOUND"};$b=[IO.File]::ReadAllBytes($e);$pe=[BitConverter]::ToInt32($b,0x3c);$n=[BitConverter]::ToUInt16($b,$pe+6);$opt=[BitConverter]::ToUInt16($b,$pe+20);$s=$pe+24+$opt;Write-Host "$l|EXE_SHA=$((Get-FileHash $e).Hash)|SIZE=$($b.Length)|SECTIONS=$n";for($i=0;$i-lt$n;$i++){$o=$s+40*$i;$nm=([Text.Encoding]::ASCII.GetString($b,$o,8)).Trim([char]0);Write-Host "$l|SECTION=$nm|RAWSIZE=$([BitConverter]::ToUInt32($b,$o+16))|RAWPTR=$([BitConverter]::ToUInt32($b,$o+20))"};$needle=[Text.Encoding]::UTF8.GetBytes($dllName);$found=-1;for($i=0;$i-le$b.Length-$needle.Length;$i++){$ok=$true;for($j=0;$j-lt$needle.Length;$j++){if($b[$i+$j]-ne$needle[$j]){$ok=$false;break}};if($ok){$found=$i;break}};$v=[Diagnostics.FileVersionInfo]::GetVersionInfo($e);$dv=[Diagnostics.FileVersionInfo]::GetVersionInfo($dll);Write-Host "$l|DLL_OFFSET=$found|EXE_FILEVERSION=$($v.FileVersion)|EXE_PRODUCTVERSION=$($v.ProductVersion)";Write-Host "$l|DLL_SHA=$((Get-FileHash $dll).Hash)|DLL_PRODUCTVERSION=$($dv.ProductVersion)";$coreNames=@($depsName;$runtimeConfigName;'hostfxr.dll';'hostpolicy.dll';'coreclr.dll';'clrjit.dll');foreach($f in $coreNames){$x=Join-Path $d $f;if(!(Test-Path -LiteralPath $x)){throw "$l MISSING_CORE=$f"};Write-Host "$l|CORE=$f|SHA=$((Get-FileHash -LiteralPath $x).Hash)"}}
          FP A "$env:RUNNER_TEMP\A";FP B "$env:RUNNER_TEMP\B"
          $invariantNames=@($dllName;$depsName;$runtimeConfigName;'hostfxr.dll';'hostpolicy.dll';'coreclr.dll';'clrjit.dll');foreach($f in $invariantNames){$a=(Get-FileHash -LiteralPath (Join-Path "$env:RUNNER_TEMP\A" $f)).Hash;$b=(Get-FileHash -LiteralPath (Join-Path "$env:RUNNER_TEMP\B" $f)).Hash;Write-Host "INVARIANT|$f|A=$a|B=$b|MATCH=$($a-eq$b)";if($a-ne$b){throw "NON_NORMALIZER_IDENTITY_CHANGED=$f"}}
          function Launch($l,$d){$e=Join-Path $d $exeName;Start-Sleep -Milliseconds 300;$sw=[Diagnostics.Stopwatch]::StartNew();$p=Start-Process $e -WorkingDirectory $d -PassThru;$sw.Stop();Write-Host "$l|LAUNCH_RETURNED=True|PID=$($p.Id)|ELAPSED_MS=$($sw.ElapsedMilliseconds)";$end=[DateTime]::UtcNow.AddSeconds(8);$h=0;do{Start-Sleep -Milliseconds 250;try{$p.Refresh();$h=$p.MainWindowHandle}catch{}}while([DateTime]::UtcNow-lt$end-and!$p.HasExited-and$h-eq0);$same=@(Get-CimInstance Win32_Process|?{$_.ExecutablePath-eq$e});Write-Host "$l|ALIVE=$(!$p.HasExited)|HWND=$h|EXACT_PATH_COUNT=$($same.Count)|DUPLICATE=$($same.Count-gt1)";foreach($q in $same){Write-Host "$l|PROC_PID=$($q.ProcessId)|PPID=$($q.ParentProcessId)";Stop-Process -Id $q.ProcessId -Force -ErrorAction SilentlyContinue}}
          Launch A "$env:RUNNER_TEMP\A";Launch B "$env:RUNNER_TEMP\B"
