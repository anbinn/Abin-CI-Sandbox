name: C20 Candidate Reproduction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/c20-candidate-reproduction.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 474471262da118842db022cf2711b613da681dd0
          token: ${{ secrets.ABIN_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Strict normalizer A/B isolation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $baseline='474471262da118842db022cf2711b613da681dd0'
          $actual=(git rev-parse HEAD).Trim(); Write-Host "SOURCE_SHA=$actual"; if($actual-ne$baseline){throw 'BASELINE_MISMATCH'}
          if((dotnet --version).Trim()-ne'10.0.401'){throw 'SDK_MISMATCH'}
          $runtimes=dotnet --list-runtimes;if(-not($runtimes|Select-String '^Microsoft\.NETCore\.App 10\.0\.12 ')){throw 'RUNTIME_MISMATCH'};Write-Host 'RUNTIME=10.0.12'
          $sdkRoot=(dotnet --list-sdks|?{$_ -match '^10\.0\.401 '})-replace '^10\.0\.401 \[',''-replace '\]$',''
          $hostModel=Join-Path $sdkRoot '10.0.401\Microsoft.NET.HostModel.dll';$sdkAppHost=Join-Path $sdkRoot '10.0.401\AppHostTemplate\apphost.exe';$pack=Join-Path (Split-Path $sdkRoot -Parent) 'packs\Microsoft.NETCore.App.Host.win-x64\10.0.12\runtimes\win-x64\native\apphost.exe'
          Write-Host "HOSTMODEL_SHA=$((Get-FileHash $hostModel).Hash)|SIZE=$((Get-Item $hostModel).Length)";Write-Host "SDK_APPHOST_SHA=$((Get-FileHash $sdkAppHost).Hash)|SIZE=$((Get-Item $sdkAppHost).Length)";Write-Host "PACK_APPHOST_SHA=$((Get-FileHash $pack).Hash)|SIZE=$((Get-Item $pack).Length)"
          if((Get-FileHash $sdkAppHost).Hash-ne'0649F1BEBACEF4F17B6694201ABC6DDE152C333468D2314B4F7104D34D70C7AA'){throw 'APPHOST_INPUT_HASH_MISMATCH'}
          $stem=-join([int[]](0x963F,0x658C,0x89C6,0x9891,0x4E0B,0x8F7D,0x5668)|%{[char]$_});$exeName=$stem+'.exe';$dllName=$stem+'.dll';$depsName=$stem+'.deps.json';$runtimeConfigName=$stem+'.runtimeconfig.json';$proj=Join-Path $PWD 'VideoDownloader.csproj';$original=[IO.File]::ReadAllBytes($proj);$originalHash=(Get-FileHash $proj).Hash
          $aLog=Join-Path $env:RUNNER_TEMP 'A-publish.log';$bLog=Join-Path $env:RUNNER_TEMP 'B-publish.log'
          Write-Host 'A_PUBLISH=dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false'
          dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\A" 2>&1 | Tee-Object -FilePath $aLog
          if($LASTEXITCODE-ne0){throw 'A_PUBLISH_FAILED'};if((Get-FileHash $proj).Hash-ne$originalHash){throw 'A_MUTATED_PROJECT'}
          $aText=Get-Content -LiteralPath $aLog -Raw;if($aText-notmatch'AppHostVersionResourceNormalizer' -or $aText-notmatch'APPHOST_VERSION_RESOURCE_POLICY=REMOVED_RT_VERSION'){throw 'A_NORMALIZER_EXECUTION_NOT_PROVEN'};Write-Host 'A_NORMALIZER_EXECUTION=PROVEN'
          $xml=[Text.Encoding]::UTF8.GetString($original);$p1='(?s)\s*<Target Name="PrepareAppHostVersionResourceNormalizer".*?</Target>';$p2='(?s)\s*<Target Name="NormalizeWindowsAppHostVersionResource".*?</Target>'
          if(([regex]::Matches($xml,$p1)).Count-ne1-or([regex]::Matches($xml,$p2)).Count-ne1){throw 'NORMALIZER_TARGET_MATCH_COUNT'};$bxml=[regex]::Replace([regex]::Replace($xml,$p1,'',1),$p2,'',1)
          try{[IO.File]::WriteAllText($proj,$bxml,(New-Object Text.UTF8Encoding($false)));if((Select-String $proj -Pattern 'PrepareAppHostVersionResourceNormalizer|NormalizeWindowsAppHostVersionResource' -Quiet)){throw 'B_TARGET_PRESENT'};Write-Host 'B_BUILD_DIFFERENCE=ONLY_TWO_NORMALIZER_TARGETS_REMOVED';git diff -- VideoDownloader.csproj|Write-Host;dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\B" 2>&1 | Tee-Object -FilePath $bLog;if($LASTEXITCODE-ne0){throw 'B_PUBLISH_FAILED'}}finally{[IO.File]::WriteAllBytes($proj,$original)}
          if((Get-FileHash $proj).Hash-ne$originalHash-or@(git status --porcelain).Count-ne0){throw 'BASELINE_RESTORE_FAILED'}
          $bText=Get-Content -LiteralPath $bLog -Raw;if($bText-match'AppHostVersionResourceNormalizer' -or $bText-match'APPHOST_VERSION_RESOURCE_POLICY=REMOVED_RT_VERSION'){throw 'B_NORMALIZER_UNEXPECTEDLY_EXECUTED'};Write-Host 'B_PREPARE_NORMALIZER=NOT_EXECUTED';Write-Host 'B_NORMALIZE_APPHOST_RESOURCE=NOT_EXECUTED'
          function FP($l,$d){$e=Join-Path $d $exeName;$dll=Join-Path $d $dllName;if(!(Test-Path $e)-or!(Test-Path $dll)){throw "$l PRODUCT_FILES_NOT_FOUND"};$b=[IO.File]::ReadAllBytes($e);$pe=[BitConverter]::ToInt32($b,0x3c);$n=[BitConverter]::ToUInt16($b,$pe+6);$opt=[BitConverter]::ToUInt16($b,$pe+20);$s=$pe+24+$opt;$eh=(Get-FileHash $e).Hash;$dh=(Get-FileHash $dll).Hash;Write-Host "$l|EXE_NAME=$exeName|EXE_SHA=$eh|SIZE=$($b.Length)|SECTIONS=$n";for($i=0;$i-lt$n;$i++){$o=$s+40*$i;$nm=([Text.Encoding]::ASCII.GetString($b,$o,8)).Trim([char]0);Write-Host "$l|SECTION=$nm|RAWSIZE=$([BitConverter]::ToUInt32($b,$o+16))|RAWPTR=$([BitConverter]::ToUInt32($b,$o+20))"};$needle=[Text.Encoding]::UTF8.GetBytes($dllName);$found=-1;for($i=0;$i-le$b.Length-$needle.Length;$i++){$ok=$true;for($j=0;$j-lt$needle.Length;$j++){if($b[$i+$j]-ne$needle[$j]){$ok=$false;break}};if($ok){$found=$i;break}};$v=[Diagnostics.FileVersionInfo]::GetVersionInfo($e);$dv=[Diagnostics.FileVersionInfo]::GetVersionInfo($dll);Write-Host "$l|DLL_NAME=$dllName|DLL_OFFSET=$found|EXE_FILEVERSION=$($v.FileVersion)|EXE_PRODUCTVERSION=$($v.ProductVersion)";Write-Host "$l|DLL_SHA=$dh|DLL_PRODUCTVERSION=$($dv.ProductVersion)";$coreNames=@($depsName,$runtimeConfigName,'hostfxr.dll','hostpolicy.dll','coreclr.dll','clrjit.dll');foreach($f in $coreNames){$x=Join-Path $d $f;if(!(Test-Path -LiteralPath $x)){throw "$l MISSING_CORE=$f"};Write-Host "$l|CORE=$f|SHA=$((Get-FileHash -LiteralPath $x).Hash)"};return [pscustomobject]@{ExeHash=$eh;DllHash=$dh;Size=$b.Length}}
          $afp=FP A "$env:RUNNER_TEMP\A";$bfp=FP B "$env:RUNNER_TEMP\B"
          if($afp.ExeHash-ne'18599C12A9A00E75F13A58F48E355F6F6FF20DBAEE049D8E856373AF5006A358'-or$afp.Size-ne279552-or$afp.DllHash-ne'D84742FEF988201F60DAEF4657B941E6184CF5E555D5AD782AB1988236A24ECE'){throw 'A_HISTORICAL_IDENTITY_MISMATCH'};Write-Host 'A_HISTORICAL_COMPARABILITY=PASS'
          $invariantNames=@($dllName,$depsName,$runtimeConfigName,'hostfxr.dll','hostpolicy.dll','coreclr.dll','clrjit.dll');foreach($f in $invariantNames){$a=(Get-FileHash -LiteralPath (Join-Path "$env:RUNNER_TEMP\A" $f)).Hash;$b=(Get-FileHash -LiteralPath (Join-Path "$env:RUNNER_TEMP\B" $f)).Hash;Write-Host "INVARIANT|$f|A=$a|B=$b|MATCH=$($a-eq$b)";if($a-ne$b){throw "NON_NORMALIZER_IDENTITY_CHANGED=$f"}}
          function Launch($l,$d){$e=Join-Path $d $exeName;Start-Sleep -Milliseconds 500;$sw=[Diagnostics.Stopwatch]::StartNew();$p=Start-Process -FilePath $e -WorkingDirectory $d -PassThru;$sw.Stop();Write-Host "$l|LAUNCH_RETURNED=True|PID=$($p.Id)|ELAPSED_MS=$($sw.ElapsedMilliseconds)";$end=[DateTime]::UtcNow.AddSeconds(12);$h=[IntPtr]::Zero;$title='';do{Start-Sleep -Milliseconds 250;try{$p.Refresh();$h=$p.MainWindowHandle;$title=$p.MainWindowTitle}catch{}}while(([DateTime]::UtcNow-lt$end)-and(-not$p.HasExited)-and($h-eq[IntPtr]::Zero-or[string]::IsNullOrWhiteSpace($title)));$same=@(Get-CimInstance Win32_Process|?{$_.ExecutablePath-eq$e});$usable=(-not$p.HasExited)-and($h-ne[IntPtr]::Zero)-and(-not[string]::IsNullOrWhiteSpace($title));$dup=$same.Count-gt1;Write-Host "$l|ALIVE=$(-not$p.HasExited)|HWND=$h|TITLE=$title|USABLE_WINDOW=$usable|EXACT_PATH_COUNT=$($same.Count)|DUPLICATE=$dup";foreach($q in $same){Write-Host "$l|PROC_PID=$($q.ProcessId)|PPID=$($q.ParentProcessId)";Stop-Process -Id $q.ProcessId -Force -ErrorAction SilentlyContinue};return [pscustomobject]@{Usable=$usable;Duplicate=$dup;Alive=(-not$p.HasExited)}}
          $ar=Launch A "$env:RUNNER_TEMP\A";$br=Launch B "$env:RUNNER_TEMP\B"
          $aFault=(-not$ar.Usable)-or$ar.Duplicate;$bRecovered=$br.Usable-and(-not$br.Duplicate)
          Write-Host "A_HISTORICAL_FAULT_REPRODUCED=$aFault";Write-Host "B_NORMAL_SINGLE_LAUNCH=$bRecovered";Write-Host "CAUSE_PROVEN=$(if($aFault-and$bRecovered){'YES'}else{'NO'})"
