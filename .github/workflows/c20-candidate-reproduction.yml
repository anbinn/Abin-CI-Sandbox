name: C20 Candidate Reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anbinn/Abin
          ref: 474471262da118842db022cf2711b613da681dd0
          token: ${{ secrets.ABIN_PRIVATE_READ_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Capture pinned toolchain and candidate A
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          dotnet --info
          $sdk=(dotnet --version).Trim(); if($sdk -ne '10.0.401'){throw "SDK=$sdk"}
          $sdkRoot=(dotnet --list-sdks | Where-Object {$_ -match '^10\.0\.401 '}) -replace '^10\.0\.401 \[','' -replace '\]$',''
          $hostModel=Join-Path $sdkRoot '10.0.401\Microsoft.NET.HostModel.dll'
          $sdkAppHost=Join-Path $sdkRoot '10.0.401\AppHostTemplate\apphost.exe'
          $pack=Join-Path (Split-Path $sdkRoot -Parent) 'packs\Microsoft.NETCore.App.Host.win-x64\10.0.12\runtimes\win-x64\native\apphost.exe'
          Write-Host "HOSTMODEL_SHA=$((Get-FileHash $hostModel -Algorithm SHA256).Hash)|SIZE=$((Get-Item $hostModel).Length)"
          Write-Host "SDK_APPHOST_SHA=$((Get-FileHash $sdkAppHost -Algorithm SHA256).Hash)|SIZE=$((Get-Item $sdkAppHost).Length)"
          Write-Host "PACK_APPHOST_SHA=$((Get-FileHash $pack -Algorithm SHA256).Hash)|SIZE=$((Get-Item $pack).Length)"
          if((Get-FileHash $sdkAppHost).Hash -ne '0649F1BEBACEF4F17B6694201ABC6DDE152C333468D2314B4F7104D34D70C7AA'){throw 'APPHOST_INPUT_HASH_MISMATCH'}
          Write-Host 'PUBLISH=dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false'
          dotnet publish VideoDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\A"
          $dir="$env:RUNNER_TEMP\A"
          # Construct exact product stem from Unicode code points so the PS5.1 script source remains ASCII-only.
          $productStem = -join ([int[]](0x963F,0x658C,0x89C6,0x9891,0x4E0B,0x8F7D,0x5668) | ForEach-Object {[char]$_})
          $exeName=$productStem+'.exe'; $dllName=$productStem+'.dll'
          $exe=Join-Path $dir $exeName
          $dll=Join-Path $dir $dllName
          if(!(Test-Path -LiteralPath $exe) -or !(Test-Path -LiteralPath $dll)){throw 'PRODUCT_FILES_NOT_FOUND'}
          $b=[IO.File]::ReadAllBytes($exe); $pe=[BitConverter]::ToInt32($b,0x3c); $n=[BitConverter]::ToUInt16($b,$pe+6); $opt=[BitConverter]::ToUInt16($b,$pe+20); $sec=$pe+24+$opt
          Write-Host "A|EXE_NAME=$([IO.Path]::GetFileName($exe))|EXE_SHA=$((Get-FileHash $exe -Algorithm SHA256).Hash)|SIZE=$($b.Length)|SECTIONS=$n"
          for($i=0;$i -lt $n;$i++){ $o=$sec+40*$i; $name=([Text.Encoding]::ASCII.GetString($b,$o,8)).Trim([char]0); $rs=[BitConverter]::ToUInt32($b,$o+16); $rp=[BitConverter]::ToUInt32($b,$o+20); Write-Host "A|SECTION=$name|RAWSIZE=$rs|RAWPTR=$rp" }
          $needle=[Text.Encoding]::UTF8.GetBytes([IO.Path]::GetFileName($dll)); $found=-1; for($i=0;$i -le $b.Length-$needle.Length;$i++){ $ok=$true; for($j=0;$j -lt $needle.Length;$j++){if($b[$i+$j] -ne $needle[$j]){$ok=$false;break}}; if($ok){$found=$i;break} }; Write-Host "A|DLL_NAME=$([IO.Path]::GetFileName($dll))|DLL_OFFSET=$found"
          $vi=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe); Write-Host "A|EXE_FILEVERSION=$($vi.FileVersion)|EXE_PRODUCTVERSION=$($vi.ProductVersion)"
          $dvi=[Diagnostics.FileVersionInfo]::GetVersionInfo($dll); Write-Host "A|DLL_SHA=$((Get-FileHash $dll -Algorithm SHA256).Hash)|DLL_PRODUCTVERSION=$($dvi.ProductVersion)"
          Get-ChildItem -LiteralPath $dir | Where-Object {$_.Name -like '*.deps.json' -or $_.Name -like '*.runtimeconfig.json'} | ForEach-Object { Write-Host "A|CORE=$($_.Name)|SHA=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
          foreach($f in @('hostfxr.dll','hostpolicy.dll','coreclr.dll','clrjit.dll')){ $p=Join-Path $dir $f; if(Test-Path $p){Write-Host "A|CORE=$f|SHA=$((Get-FileHash $p -Algorithm SHA256).Hash)"} }
